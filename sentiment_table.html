ish flag. Bovril is a brand name for beef extract.","Poster showing Belgian refugees.","Poster showing mothers and children in a cemetery, with lilies blooming.","Poster shows a spool of thread on a nettle stalk surrounded by nettle leaves; in background the Bavarian flag. Text: Collect stinging nettles, the German cotton. Bavarian Nettle Center, Munich.","Poster showing sailors in a lifeboat, as one gestures toward a sinking, burning ship in the distance.","Poster showing German soldiers overseeing slave labor in a factory, and whipping one of the workers.","Poster showing a Red Cross nurse, with angel wings, tending to a wounded soldier, against backdrop of Belgian flag.","Poster showing a soldier holding a baby, as he follows his wife.","Poster showing a woman using a plow pulled by a horse.","Poster shows a burning British biplane plunging toward the ground.","Poster showing a mother consoling her children by a canal, with the wreckage of a boat and a windmill in the background.","Poster showing Britannia, carrying the British flag, leading citizens from a pastoral landscape toward a city in flames.","Print shows a front facial view of Lord Kitchener with his arm and fingers pointing at the viewer.","Poster showing the British flag.","Poster showing, in silhouette, a sailor on a gunboat, and sailors kneeling with rifles.","Poster showing John Bull pointing and addressing the viewer, with burning buildings and a line of soldiers with gaps in the background.","Poster shows a soldier sitting reading the newspaper. Text: Newspaper of the 10th Army.","Poster showing St. George slaying the dragon; scene in roundel format.","Poster shows explosions on and around a ship. Text is an advertisement (?) for a book about how a blockade runner delivered munitions to Germany's East African soldiers.  Prices for bound and unbound editions are given.","Poster shows a classical figure, with arms raised, holding a sword. The figure is surrounded by drowning people and in the background the oceanliner Lusitania is sinking.","Poster showing Belgian refugees and soldiers.","Poster shows a German Army officer holding a glass of sekt (champagne) with the name Feist Sekt on it. Poster is an advertisement for the Feist Sektkellerei, Frankfurt am Main.","Poster shows a Christmas angel(?) pulling a sleigh loaded with bundles and delivering one to a German soldier. Text: Christmas collection by the Bavarian Red Cross for the armed forces.","Poster showing a sailor on deck, holding a telescope, looking off at another ship in the distance.","Poster showing \"Recruiting-Sergeant Punch\" gesturing and standing in front of a broadside, mostly indistinct but reading, \"Wanted. 500,000 men for the Army... Recruiting office... Kitchener.\"","Poster showing full-length portrait of John Joseph Pershing.","Head of Wilhelm II as spider.","Poster showing marines on a beach, carrying rifles and flags.","Poster showing the Air Service insignia, various aircraft including airplanes and dirigibles, and a crew tending to a plane in the foreground.","Poster showing a figure of Columbia holding a pen, and a Red Cross nurse with a scroll, inscribed \"Where Columbia sets her name, let every one of you follow her.\"","Poster showing personification of Italy, depicted as woman wearing olive wreath in profile within a circular border.","A man looking out window at troops marching with large American flag.","Poster showing five men in naval uniforms standing beneath a large eagle bearing a stars and stripes shield.","Poster showing a small scene of work in a shipyard, above lengthy text.","Poster showing a man in overalls at work, and a soldier.","U.S. Food Administration poster, asking for food conservation, illustrated with raw foods on table.","Poster showing a man in uniform with electrical equipment.","Poster showing a monumental eagle on a mountaintop as planes fly below.","Poster showing underwater view of fish swimming among seaweed.","Poster showing soldiers in a truck calling out to a young man.","Near eastern girl with arms outstretched.","Poster shows a Bulgarian soldier smoking. Poster is an advertisement for cigarettes produced by Menes Cigarette Factory, Wiesbaden, Germany.","Poster showing a workman, and silhouette of troops and truck crossing a pontoon bridge.","Poster shows two wounded German soldiers, one with arm in a sling, the other with a crutch. Text announces an exhibition in Cologne to raise money for wounded veterans.","Poster shows a man, wearing a soldier's helmet and holding a plow, shouting; behind him is a field of wheat(?) and flowers. Text: Brothers, enlist in the Reichswehr.","Poster showing a disabled man with a crutch standing in a doorway looking at landscape beyond, with Red Cross nurse and others in foreground.","Poster showing a young woman in a Navy uniform.","Woman in uniform carrying stretcher.","Poster showing a young woman with an American flag.","Poster shows a vase of flowers drawn in a folk art style with two coats of arms on either side. Text announces an exhibit of antique arts and crafts from Vilna and Minsk presented by the 10th Army. Location in Vilna, hours, and prices of admission are given.","Poster showing a Red Cross nurse with an American flag and the Red Cross symbol.","Poster shows a Wave, half-length, standing, facing front.","Poster showing a woman in white waving the American flag, as soldiers march behind her.","Poster showing a mechanic in overalls.","Poster showing Kosciuszko and Pulaski, and the Polish flag.","Poster showing a candle and the Red Cross emblem in a window, with a Christmas tree in the background.","Poster showing a sailor astride a torpedo.","Poster showing a boy with a hoe leading a parade of vegetables, with American flags.","Poster showing a woman draped in American flag, in front of red cross, pointing across ocean.","Poster showing a sailor blowing a bugle.","Poster showing a Polish soldier brandishing a rifle, and the Polish flag.","Poster showing a woman clutching a shawl around her shoulders.","Boy with hoe leading vegetables marching with an American flag.","Poster showing a winged knight on a horse.","Poster showing a dog holding a hat in its mouth, filled with coins and Red Cross membership receipts, against background of Red Cross flags.","Poster showing a young woman knitting.","Poster showing a portrait of a young woman.","Poster shows a soldier gesturing in the direction of a building which has \"Freiwilligen-Centrale\" written over door and a line of people before door. Text: Off to the Volunteer Center! Address and name of military group is given.","Poster showing a soldier and a student.","Poster showing a parade of women workers wearing uniforms appropriate for specific jobs.","Poster showing flags of various service organizations flying at a military parade.","Poster showing a woman draped in American flag, in front of red cross, pointing across ocean.","Poster shows a desperate-looking German soldier bundled against the cold, carrying a large pack on his back. Text asks for emergency donations to the Soldiers' Aid Fund to help soldiers returning from the front as they pass through Berlin.","Poster shows a large group of figures in the shape of Upper Silesia and a train going past them. Text states that millions of patriotic Upper Silesians wish to vote in the upcoming election but are too poor to travel. Donations to the Bavarian Border Fund are requested and establishments accepting donations are given.","U.S. Army recruiting poster showing a soldier standing with gun ready, with a wreath in the background.","Soldiers and civilians stacking bags of gold on a pedestal. A   Gallic cock is on top of the pedestal. Civic instructions are listed   below.","Poster showing a woman seated, in profile, taken from Whistler's \"Arrangement in Grey and Black,\" commonly called \"Whistler's Mother.\"","Soldiers standing on a tank. Tank warfare was first introduced into WWI by the British in 1916. The word 'tank' was originally a security name given to these 'land ships' or 'land cruisers.'","On the right is a woman with her two children. In the center is a train. On the left are two soldiers at the front. One has outstretched arms reaching for the supplies that are falling from   the sky.","Poster shows a view of Earth with flames in the eastern hemisphere. Poster is an advertisement for The Great War by Hanns von Zobeltitz, a book with maps and pictures.","Poster showing two soldiers on the field, one gesturing toward a Church Army building nearby, with caption: \"You'll find all you want\" in a hut of the Church Army.","Poster showing god of war Mars, in Roman dress, encouraging British munitions workers (i.e., god of fire Vulcan) to supply armaments for the troops seen in the background.","Poster showing god of war Mars, in Roman dress, encouraging British munitions workers (i.e., god of fire Vulcan) to supply armaments for the troops seen in the background.","Poster showing a bloody hand print.","Poster for Red Cross student membership drive, including blank spaces for the name of the school and the number of members enrolled, American and Red Cross flags, and portraits of Woodrow Wilson, Lincoln, and Washington.","Poster shows a girl collecting stinging nettles. Text:  Collect stinging nettles if you want clothing and thread. Information available from the Bayerische Nesselstelle, Munich.","French and Italian flags crossed. Italy had joined the Triple Alliance with Germany and Austia-Hungary in 1882, but had declared its neutrality in 1914. At this time, both sides, knowing of Italy's interest in colonial expansion, tried to influence Italy over to their side. In 1915, the Triple Entente agreed to Italy's demands for colonial territories and Italy came into the war on the side of the Allied Powers.","Poster shows soldier in profile against a Union Jack. Text encourages enlistment, referring to 1915 battles of St. Julien and Festubert.","Poster shows a frightened man clutching an Italian flag in one hand and a sword in another. Poster announces a 5% national consolidated loan. Details are given.","Poster shows a blacksmith(?) holding a bag of household items made of metal. Text tells people that household items made from aluminum, copper, brass, nickel and tin have been appropriated. Regulation number is given and additional text indicates that it is available for all to sign at the collection sites.","Poster showing graves marked with crosses on a hill, much like views of Calvary.","Poster shows a farmer on a horse leading two plow horses pointing and to vignette showing soldiers in battle. Text encourages boy between the ages of 15 and 19 to volunteer for the Soldiers of the Soil program.","Poster shows soldiers charging forward under the number 245.","Poster shows soldier in profile against a Union Jack. Text encourages enlistment, referring to 1915 battles of St. Julien and Festubert.","Poster showing silhouette of soldiers and firing cannon against a red, white, and blue sky, with United States seal below.","Poster shows large statue against a standard on which is the German Imperial crest. Text announces the dedication of an Eiserne Wehrmann (Iron Warrior) to benefit the survivors of fallen soldiers of the First Army Corps (East Prussia). Details of dedication are given.","Poster shows a naked little boy holding a red flag. Text: Don't strangle the young freedom with chaos and fratricide or else your children will go hungry.","Poster showing the Statue of Liberty in ruins, and the New York skyline in flames.","Poster shows a blacksmith with a raised hammer. Text is advertisement for a play to benefit the War Aid, organized by Berlin Military Headquarters. Location, performance days, times, performers and other details are given.","Poster showing the Statue of Liberty in ruins, and the New York skyline in flames.","A man and a woman, wrapped in blankets, seated and standing, respectively, near an empty fireplace.  This was a campaign to supply those at home, particularly older people, with wood or coal for heat.","Poster shows an Australian soldier with rifle in one hand gesturing toward other soldiers in battle.","Poster shows soldiers, some holding laurel wreaths, celebrating beneath two large columns decorated with laurel and having eternal flames(?) on top. Text: 8th War Loan.","Poster showing a portrait of General Pershing, with a quote from him in support of the United War Work Campaign.","Poster shows a Red Cross nurse giving a wounded soldier a glass of water. Text asks people to collect empty mineral water bottles and donate them to the Red Cross.","Poster shows a German soldier seated by a stove and warming his hands. Text: Contribute for Bavarian Soldiers' Homes.","Poster shows, on the left, a German soldier standing behind a large shape representing the land mass controlled by the Central Powers; on the right a British (?) soldier with his foot on a tiny piece representing the land mass held by the Entente. In the center, under the title \"Who is the Victor?\" is a chart showing how much territory the Central Powers gained between May 1915 to June 1917 and how, in the same period, the Entente lost territory.","Membership campaign poster for the Girls Division of the New York War Camp Community Service showing a painting by Albert Herter of Liberty standing behind a soldier and helping him hold up the American flag.","Poster showing soldiers in battle, with caption: Your friends need you. Be a man!","Poster shows a Landesknecht soldier beating a drum. Text encourages officers and enlisted soldiers, familiar with all weapons, to join the Freischar Loeschebrand. Place of registration and benefits are listed.","Poster shows a soldier with shamrocks in his hand, cap and in his gun barrel, walking along a country road.","Poster shows head of a sailor against a blue background which takes the shape of a ship at the top. Text announces a Navy play(?). Details are given.","Poster shows a soldier playing bagpipes.","Poster shows a soldier playing bagpipes.","Poster showing a sailor being sent to battle by a symbolic female figure with sword, possibly Liberty.","Poster showing a sailor being sent to battle by a symbolic female figure, possibly Liberty.","Poster showing small image of hands at top, and emblem of National Service Industrial Army, 1917 below.","Poster showing Uncle Sam holding playing cards labeled Farmer, Consumer, Banker, Wage earner, and Manufacturer.","Three men on a scaffold attaching a French flag to the top of a building's spire.","Poster showing a panoramic view of the U.S. Treasury Building from the southeast.","Poster showing an elderly woman playing piano for a group of sailors.","A nurse watching children playing outdoors.","Poster shows Uncle Sam playing a fife, leading a group of children carrying gardening tools and a seed bag.","A German soldier being buried by bags of gold thrown on top of him by 'Victory.'","Children playing in the snow and throwing snowballs at a snowman resembling the Kaiser.","Poster showing a draped figure reaching upward toward the insignia of the Red Cross.","Poster showing a woman in white robes, wearing a Liberty cap, with the flags of the Allies; names of battles are inscribed in the borders.","Poster shows St. George slaying a dragon. Text, under heading \"Our Emperor to his people\" is a proclamation issued by Kaiser Wilhelm II on July 31, 1914, concerning the advent of war, the coming struggle, and the need to pray for God's help for the soldiers. Poster was issued for the benefit of the Red Cross.","Poster showing a captain on deck at sea, blindfolded and reaching out.","A black hen sitting on top of a large pile of eggs.","Poster showing three soldiers playing cards outside a bunker.","Poster showing a soldier charging into battle, accompanied by Liberty bearing a sword and an American flag.","Poster showing the U.S. Treasury building in Washington, D.C.","Poster shows an Australian soldier, his head and forearm wrapped in bandages, holding a gun with one hand and shading his eyes with the other.","Poster showing a sailor reaching out to a young girl in a lifeboat labeled \"Lusitania.\"","Prussia depicted as an octopus whose tentacles are reaching into Europe.","Poster showing a soldier playing bagpipes, beside him a dog, with troops marching in the background.","Poster showing horse-drawn ploughing, soldiers on the battlefield, and men in line to purchase Liberty bonds.","Poster shows silhouette of a kneeling woman (probably modeled on a work by Hermann Hosaeus) holding a jewelry box and offering a gold rosary(?). Text: I gave gold for defense, iron I honored(?). Bring your gold jewelry to the gold dealers.","Poster shows a Bolshevik leaning on a map of Europe and setting fire to Bavaria. Text: The Bolshevik is coming! Throw him out on Election Day! Bavarian People's Party.","Poster showing figure \"America\" with shield \"Liberty Loan\" fighting against \"Devastation,\" \"Starvation,\" \"War,\" \"Pestilence,\" and \"Death.\"","Poster shows German soldiers around a cannon. In the background looms an image of General Paul von Hindenburg. Text advertises part 1 of the film \"The Great Battle in France.\"","Poster shows head-and-shoulders portrait of a German soldier. Text is a call for veterans to join the border-guard batallion Spandau, stating \"the Fatherland is in danger! This is an emergency!\" Registration address and benefits are given.","Poster shows a giant, representing Germany, crushing bodies. Text: German peace.","Poster shows a soldier pointing in the air with explosions in the background. Text continues: Well fed soldiers will win the war.","A woman with a bowed head and a small child in her lap. A little boy stands beside her with his head bowed as well.","Poster announcing that donations for the Ludendorff Fund are accepted at this location.","Poster showing a robed allegorical figure of womanhood supporting an injured man as she helps him through a doorway, captioned, \"Haven.\"","Poster shows a large fist smashing down on a German border marker; to one side are skulls and a church being blown up; on the other side are the towers of Munich's Frauenkirche and mountains. Text is a poem about the enemy (Communism) being in the country (Bavaria) and telling people to resist by supporting the Bavarian People's Party.","Poster shows a man, with a red sash around his waist, standing in front of red flags. He is pointing to the three phrases \"undisturbed demobilization\", \"creation of the Republic\", and \"peace.\"","Poster showing a tank \"American industry\" rolling over \"Disloyalty.\" A tiny bird comments, \"Nothing can stop them!\"","Poster shows German soldier, with gas mask hanging from his neck, gazing into the distance. Text reads: Help us triumph! Subscribe to the War Loan.","Poster showing Liberty in a red cloak, holding a sword and a scroll inscribed \"We can do no otherwise.\"","Poster showing a father and son in the field of their farm, as the father bids goodbye and the son goes to join troops marching by.","Poster showing a treasure chest, with soldiers in the background.","Poster announcing the eighth war loan, suggesting that the stronger the result, the sooner there will be a just peace.","Poster showing soldiers boarding a train, gesturing to others to join them.","Poster showing a soldier with rifle, and a scene of a \"Savings Bank\" clerk helping customers at a post office.","Poster explains in detail the particulars of incentives for enlistment.","Poster shows a silhouette of the merchant submarine Deutschland in calm waters. The poster is an advertisement for a book about the submarine Deutschland by the ship's captain Paul Ko\u0308nig.","Poster showing Uncle Sam, in the uniform of a soldier, protecting a woman who has collapsed beneath a cross inscribed \"Slavery\" and \"Barbarism.\" Uncle Sam also points a revolver at the Kaiser, who wears a crown and royal robes and brandishes a whip. Statue of Liberty visible in background.","Poster showing a youthful soldier holding a rifle with bayonet.","Poster showing a pensive man with his daughter on his lap, while a boy plays with toy soldiers at his feet.","Poster showing a large Uncle Sam patting Admiral George Dewey on the head.","Poster shows portrait of Field Marshall Paul von Hindenburg. Text below is a quote from von Hindenburg stating that the Rhine will never be reached as long as the Army and Navy work together to protect the river. Poster title: On the 70th birthday.","Poster showing soldiers and Army insignia with the exclamation, \"Well done!\"","Poster shows a soldier holding up a book and calling out, \"Hey Fellows!\", with a sailor sitting on the ground at his feet, reading. The soldier seems to be issuing a general call to both his fellow servicemen to come get books, as well as to his fellow countrymen to contribute funds to make books available for the men in the armed forces.","A young girl in a Red Cross nurse's uniform and a small boy wearing a red cap, carrying a collection cup and selling medals, respectively.","A young girl in a Red Cross nurse's uniform and a small boy wearing a red cap, carrying a collection cup and selling medals, respectively.","Poster showing a woman thinking of her soldier husband at the front, as children play around her.","The franc and the mark pushed uphill by French and German soldiers, respectively.","Poster shows a man holding a sword with his other arm around his wife and baby. Text: War loans help the guardians of your happiness.","Poster shows a man holding a sword with his other arm around his wife and baby. Text: War Loans help the guardians of your happiness.","Poster showing children at play in a spring landscape.","Poster shows the monogram for the Feldgrauen Ku\u0308nstler-Bundes, a large \"F\" in the shape of a sword, with \"K\" and \"B\" on either side. Text announces the permanent art exhibit of the Armed Forces Art Association, giving location and opening and closing times.","Poster shows a Polish man sitting on a Polish border gate and gesturing to a couple to go to Poland. Behind him are clouds forming image of man with plenty to eat. The couple on the German side of the border walk by, the man's arm raised as if shielding himself from the image. Text: Don't be fooled, stay with Germany!","Poster shows a huddled group of poor refugees. Text: This is what the Polish emmigrants look like, and you'll look like this too if Silesia becomes part of Poland. Upper Silesians! Stay with the new Germany!","Poster showing a young man in uniform shaking the hand of an older man, with a landscape of farms in the distance.","Service Series poster promoting the First Division as a unit that works around the clock, showing half-length drawing of a soldier, holding rifle, on the face of a clock.","Poster showing a wounded soldier looking to the horizon, where a Red Cross ambulance approaches and the Red Cross emblem rises like the sun.","Poster showing a dedication ceremony at which a keystone labeled Victory Liberty Loan is hoisted into an arch composed of blocks labeled Army, Navy, munitions, ship building, etc.","Poster showing a line of soldiers at attention, flanking a sign which reads, \"This space is reserved for a fit man.\"","Poster showing a returning soldier, with factories beyond, including lengthy text promoting use of British goods and jobs for British citizens throughout the empire.","Poster shows an altar or monument decorated with a cross in the form of a dagger; flames ascend from the altar dividing the date 1918. Text is a quotation imploring the holy flame to never extinguish and forever burn brightly for the Fatherland.","Poster showing a mother and praying child, with a portrait of a soldier on the wall behind them. The child's prayer appears below the scene.","Poster shows an altar (?) decorated with a cross in the form of a dagger; flames ascend from the altar dividing the date 1918. Text is a quotation emploring the holy flame to never extinguish and forever burn brightly for the Fatherland.","Poster showing a soldier with American flag and laurel wreath, surrounded by admiring citizens.","Poster shows a German soldier holding a rifle. Text: Defend yourself, protect yourself, wake up. Enlist in the Bavarian Reichswehr.","Poster showing a soldier in silhouette. Text explains salary and benefits for enlistment.","U.S. Marines recruitment poster showing marines in a landing party.","Poster shows a soldier holding two Army standards. Text announces an exhibit of armed forces prints, a special exhibit by the 10th Army Newspaper. Location in Vilna and dates are given.","Poster showing an idyllic English village scene, with poem by Samuel Rogers, \"A wish, mine be a cot beside the hill...\"","Two boys and a girl comforting each other.","Poster showing two working class men engaged in conversation, one smoking a pipe, the other eating.","Mother serving food at the dinner table. Rules of a healthy diet written below.","Poster showing a Red Cross nurse appealing to a young woman for help, as another nurse tends to a wounded man.","Poster showing a Red Cross nurse holding a wounded soldier as she signals for help.","Poster showing a group of soldiers approaching a warmly lit YMCA facility, through the snow, at night.","Poster showing a group of soldiers approaching a warmly lit YMCA facility, through the snow, at night.","Poster featuring a strip of the cartoon \"Ain't it a grand and glorious feelin'?\" showing a soldier and his family in a YWCA hostess house.","Poster showing the United States Capitol; includes large blank space for message.","Poster showing two Red Cross nurses, one, a Madonna figure, cradling in her arms a wounded soldier(?) on a litter, between the flags of Nicaragua and the United States.","Poster showing U.S. Navy recruiting station at the United Cigar Stores Company in the Flatiron Building in New York City on the day of the \"Wake up America\" parade, April 19, 1917.","Poster showing two Red Cross nurses, one, a Madonna figure, cradling in her arms a wounded soldier(?) on a litter, between the flags of Costa Rica and the United States.","Poster showing the flag and the United States Capitol, with a message from Woodrow Wilson.","Poster showing two Red Cross nurses, one cradling in her arms a child on a litter, between the flags of Japan and the United States.","Poster showing two Red Cross nurses, one, a Madonna figure, cradling in her arms a wounded soldier(?) on a litter, between the flags of Ecuador and the United States.","Poster showing two Red Cross nurses, one, a Madonna figure, cradling in her arms a wounded soldier(?) on a litter, between the flags of the Dominican Republic and the United States.","Poster showing the United States flag and the pennant of the U.S. Shipping Board.","Poster showing an idealized shopping district with factories in the distance.","Poster showing two Red Cross nurses, one, a Madonna figure, cradling in her arms a wounded soldier(?) on a litter, between the flags of Haiti and the United States.","Poster showing two Red Cross nurses, one, a Madonna figure, cradling in her arms a wounded soldier(?) on a litter, between the flags of Brazil and the United States.","Poster showing two Red Cross nurses, one, a Madonna figure, cradling in her arms a wounded soldier(?) on a litter, between the flags of Bolivia and the United States.","Poster showing two Red Cross nurses, one, a Madonna figure, cradling in her arms a wounded soldier(?) on a litter, between the flags of China and the United States.","Poster showing two Red Cross nurses, one, a Madonna figure, cradling in her arms a wounded soldier(?) on a litter, between the flags of Panama and the United States.","U.S. Navy recruitment poster showing a soldier and a sailor reading the want ads in a newspaper. The sailor says: \"How about trying the Navy, Doughboy? Food, quarters, training, treatment, pay, and promotion are all good. Think it over and be my shipmate.\"","A woman standing and holding a dish and the charity symbol.","A skeleton wearing a German military uniform and holding a mask of Kaiser Wilhelm's head. 'La Bai\u0308onnette' was a popular illustrated satirical journal published primarily for French soldiers stationed at the front.","Poster shows stylized profile of German soldier. Text: Protect your homeland! Enlist in the Freikorps Hu\u0308lsen.","Poster showing soldiers holding grenade launchers, protected by a sandbag wall.","The bishop of Meaux with nurses and a member of the clergy, welcoming some wounded soldiers.","Poster shows a gold heart inscribed with a poem in the center of a red cross. Text: Contribute money and gift packages to the Red Cross.","Poster shows figures of steers with beef statistics indicating how much beef Britain buys and how much Canada sells to Britain. Text continues: Speed up. We must do better.","Poster showing a mother clutching children as she reaches out for help.","Poster showing a sailor taking a man in a suit by the shoulder, and gesturing toward battleships at sea and a figure of Liberty waving the American flag.","Poster showing a soldier from behind, as he faces a bright light on the horizon, possibly an explosion or dawn.","Poster for benefit exhibition of pictures of Turkey by Krausz, showing a mosque from a distance.","Poster showing a smiling soldier.","Poster showing a smiling marine riding backwards on a wild cat, possibly a leopard.","Poster showing a smiling sailor.","Poster showing three smiling men, a marine with his arms around a sailor and a civilian.","Poster showing a war-ravaged landscape, and in the distance across a body of water, a city of skyscrapers with a serene man's face (Uncle Sam's?) hovering above.","Poster showing a soldier smiling.","Poster showing a row of smiling soldiers.","Poster shows a cherub pulling a cart with theatrical (drama and comedy) masks. Poster announces an art exhibit to benefit the Red Cross of Niedero\u0308sterreich. Details of the exhibition are given.","Poster shows a woman and child pulling a plow which is pushed by a man. Text: This is what it would be like for us in Poland! We farmers vote for Germany!","French troops (infantrymen, cavalry, etc.) gathering on a field. Field Marshal Philippe Pe\u0301tain (1856-1951) is pinning a medal on a French flag.","Poster shows two soldiers, one enlisted holding a flag, the other an officer drawing his sword, standing astride German land near the Rhine River. Text: The watch on the Rhein remains firm and loyal.","Poster showing a military medal for soldiers and a button \"V--Liberty Loan\" for civilians.","Troops of soldiers from the Napoleonic era, the French Revolution, and World War I, marching through the Arc de Triomphe. 'La   Marseillaise' is urging them on. 'La Marseillaise' became the French   national symbol for mobilization, which was taken from Franc\u0327ois Rude's (1784-1855) bas relief he sculpted for the Arc de Triomphe (1833-l836). The relief shows the  'Genius of Liberty' urging the troops of 1792 into battle. Later, this same figure is referred to as 'La Marseillaise.'","Poster shows a hand holding a soldier's helmet into which money is falling. Text: The best savings bank - the War Loan!","Poster shows a soldier(?) standing in front of a woman and her children; in bottom left hand corner is a bloody hand holding a bomb. Text: We won't tolerate anarchy! We'll protect women and children.","Poster shows German soldiers reading books in a trench. Text encourages donations to purchase reading material for the Army and Navy with slogan, \"We need books, donate money!\".","Poster showing a group of soldiers laughing.","Soldier with one hand on clock, the other holding a gold coin.","Poster showing a YMCA facility for soldiers, including distribution of books and supplies, and men in uniform relaxing, reading, writing, and smoking.","Poster showing a woman in a helmet (Minerva, personification of Britain?) caring for a mother and children.","Town crier, with bell in hand, in front of Independence Hall.","Poster showing a list of ways to save sugar.","Poster showing a woman in Salvation Army uniform raising her hand above a variety of destitute people.","Poster showing a Red Cross nurse in a cloak, extending her hand, as soldiers march behind with an American flag.","Poster showing a Red Cross nurse in a cloak, extending her hand.","Poster showing a sandbag shelter, a YMCA canteen, with soldiers relaxing out front with cups of coffee.","Poster showing a YMCA facility for soldiers, including distribution of books and supplies, and men in uniform relaxing, reading, writing, and smoking.","Poster shows a little girl with a backpack holding a fruit pit. Text instructs people to save fruit pits and send them to school with their children or to bring them to the next collection site. Poster was issued by the Kriegsausschuss fu\u0308r O\u0308le und Fette (War Commission for Oils and Fats.)","Allegorical female figure of America, standing in front of American flag, holding wreath over \"Honor roll\" consisting of last names from different ethnic groups.","Text is a quote written in Hindenburg's own hand.","A woman holding a baby in her arm and holding a collection cup in her hand. At the bottom is a sketch of a French soldier.","Poster shows a German soldier with rifle in one hand and the other raised in the \"V\" sign; in background a factory and a town. Text declares \"Everything for the Fatherland, everything for freedom\", and instructs people to register for the border infantry battalion.","A hand squeezing the throat of a snake. The snake is dripping venom.","Poster showing a hand grasping a sword in scabbard.","Poster showing American soldier holding hand grenade over German soldiers in trench.","Poster shows a young woman and an older woman standing before a table of fruits and vegetables, and some canned foods. The older woman holds up a jar and gestures toward the table. Additional text: Save perishable foods by preserving now.","German soldier, wearing pointed helment, leading girl by hand, with city burning in background.","Poster showing only a hand, extended.","Soldier holding rifle and boy standing behind him, with his hand on soldier's back.","Poster shows a man in red running from a deluge of blue and white pieces of paper marked Bayerische Volkspartei. Text: The election storm is sweeping the land! Bavarian blue and white against Russian red! Bavarian People's Party.","Poster showing a marine cheering as he raises his rifle and bayonet.","Poster showing a marine cheering as he raises his rifle and bayonet.","Poster showing an airplane crashed in the ocean, with survivors and a rescue plane.","Poster shows head-and-shoulders portrait of German soldier; in background a factory and country scene and in both lower corners the Sturmbataillon Schmidt coat of arms. Text encourages German men to protect the country and enlist in Storm Battalion Schmidt.","A captive Red Cross nurse breaking free from an officer wearing the uniform of the Death's Head Hussars. In the background are soldiers being shelled. Advertisement for a book. The officer is presumably the Crown Prince Wilhelm (1882-1951), who wore the uniform of the Death's Head Hussars.","Poster showing several dishes made with corn, including yeast bread, corn-meal fish balls, and homemade hulled corn or lye hominy; text lists numerous corn dishes, and offers free recipes on request.","Poster shows a tree of life with the German Imperial eagle at the base and coats of arms from three main cities in Silesia -- Breslau (Wroclaw), Oppeln (Opole), and Liegnitz (Legnica). Text states that Germany is the common Mother Earth of Upper-, Middle- and Lower Silesia and encourages the people of Upper Silesia to protect the unity of Silesia by forming patriotic associations.","Poster shows three soldiers on a hill, watching flocks of birds (eagles ?) flying overhead. Text: Don't forget us prisoners.","Poster showing the Statue of Liberty.","Poster showing an older woman encouraging a young man to enlist.","Poster showing soldiers escorting Liberty, in a chariot, holding an American flag.","Poster showing Uncle Sam gesturing towards troops, ships, and planes around the Statue of Liberty.","Poster showing Uncle Sam proffering Liberty Bonds, or shackles inscribed Prussia.","Poster showing a little girl with a ribbon in her hair, clutching a Liberty Loan bond.","Poster showing Liberty, and a Boy Scout holding a sword inscribed, \"Be prepared.\"","Poster showing immigrants on a ship's deck, sailing past the Statue of Liberty.","Poster showing a crowd looking up to a red cross, which floats above a cityscape of American landmarks, including the Capitol and the Statue of Liberty.","Poster is a facsimile of page 7 of The Evening Post: New York, Saturday, October 20, 1917, a full-page advertisement encouraging borrowing to buy government bonds.","Girl holding up Liberty Loan bonds.","Poster advertising a set of prints, showing Liberty looking on as a woman places a wreath on the body of a soldier.","Nude child standing next to arm of the Statue of Liberty.","Poster showing small image of the Statue of Liberty.","Liberty, bearing a shield and wrapped in the American flag, takes a sword from a figure labeled \"Labor.\"","Poster showing a large \"V\" for victory, probably intended for use in the Liberty Loan campaign.","Poster showing a shell, marked Second Liberty Loan, being shot toward German submarine.","Poster showing the Liberty Bell.","Poster showing Liberty sowing seeds.","Poster showing immigrants arriving in New York harbor, with Statue of Liberty beneath a rainbow.","Statue of Liberty on telephone.","Poster showing Liberty sowing seeds.","Design drawing for a poster showing the Statue of Liberty with the sky in the background illuminated as the American flag.","Poster showing the insignia, or button, of the Liberty Loan of 1917, with the motto \"Get behind the government.\"","Poster showing Liberty, modeled on the well-known statue complete with upraised torch, offering a Red Cross shield to a wounded soldier.","Poster showing immigrants on a ship's deck, sailing past the Statue of Liberty.","Poster showing the Statue of Liberty pointing sternly at the viewer.","Poster showing immigrants arriving in New York harbor, with Statue of Liberty beneath a rainbow.","Poster showing the Statue of Liberty pointing sternly at the viewer.","Poster showing Liberty, modeled on the well-known statue complete with upraised torch, offering a Red Cross shield to a wounded soldier.","Poster showing the Statue of Liberty with the sky in the background illuminated as the American flag.","Red Cross poster showing the figure of Liberty holding a Red Cross and the American flag.","Poster showing Uncle Sam and Liberty escorting a winged New Year's baby with sash, \"1919.\"","Poster showing soldiers enjoying pie, doughnuts, and coffee.","Poster showing the Liberty Bell.","Statue of Liberty appearing on the horizon.","Poster showing the Iron Cross and Third Liberty Loan button.","Poster shows a Christmas tree decorated with candles in front of a red cross. Text: Christmas in the field! 1917. Contribute money and gift packages for our warriors!","Poster shows a Christmas tree decorated with candles in front of a red cross. Text: Christmas in the field! 1914. Donate gift packages for our warriors!","Poster showing a cheerful soldier shouldering a rifle and smoking a pipe.","Poster shows a woman, representing Peace, with a dove on one hand and a golden sheaf in the other. The chain on her ankle has been broken, probably by the golden hammer resting on the anvil to which she had been chained. Text encourages people to sell their gold, stating that gold will defeat iron.","Poster shows a wounded Italian soldier with blood stained bandages wrapped around his eyes. Text: For the country, my eyes, for peace, your money. National Consolidated Loan ...","A peasant farmer with wife holding a child.  The Peace Loan of 1920, which was primarily for reconstruction, realized over 27 million francs.","Poster shows 19th century cavalry-man holding swords. Text asks who will protect the Fatherland and tells men proficient with any weapons to join Kreikorps Lu\u0308tzow. Place of registration and benefits are given.","Poster showing arms of George V above a quote, \"The man, be he rich or poor, is little to be envied who at this supreme moment fails to bring forward his savings for the security of his country.\" - The Chancellor of the Exchequer.","Poster shows two figures representing Great Britain and Canada exchanging money for a pig. A large hog indicates how many pounds of pork Britain buys and the smaller pig represents how much Canada sells. Text continues: We're glad to have it, Canada, but we need ten times more.","Poster encouraging people to contribute to the Ludendorff Fund for War Disabled with slogan, \"Warm Heart, open hand for those disabled by the war.\"","Poster showing scenes of naval activities, and small portraits of Admiral Sir David Beatty and Admiral Sir John Jellicoe.","Poster showing scenes of naval activities, and small portraits of Admiral Sir David Beatty and Admiral Sir John Jellicoe.","Poster showing hero Lt. Colonel H. Barre\u0301.","Poster shows a soldier cutting the bonds from a Jewish man, who strains to join a group of soldiers running in the distance and says, \"You have cut my bonds and set me free - now let me help you set others free!\" Above are portraits of Rt. Hon. Herbert Samuel, Viscount Reading, and Rt. Hon. Edwin S. Montagu, all Jewish members of the British parliament.","Poster shows a soldier cutting the bonds from a Jewish man, who strains to join a group of soldiers running in the distance and says, \"You have cut my bonds and set me free - now let me help you set others free!\" Above are portraits of Rt. Hon. Herbert Samuel, Viscount Reading, and Rt. Hon. Edwin S. Montagu, all Jewish members of the British parliament.","Poster issued by the Woman's Committee of the Council of National Defense, showing nurse with right hand raised to her heart.","Poster showing a group of happy children on a hill.","Poster showing a hand about to pitch a ball labeled \"Second Liberty Loan of 1917\" to Kaiser Wilhelm, who holds a bloody sword as a bat.","A female allegory of France, wearing a Phrygian cap and kissing a poilu on the cheek.","Poster showing a soldier holding a rifle and a grenade. In the background are women harvesting potatoes, a train, and factory smoke stacks. Text reads: Peace, work, bread!","Poster showing a drummer in uniform shouting. Text: Password: Peace!","Poster shows a smiling soldier reading a newspaper while sitting on top of a cannon. Fireworks(?) and trees are in the background. Text urges people to read the \"Aus Sundgau und Wasgenwald\" (Asuw), an army newspaper, and gives ordering information.","Poster shows five military musicians in uniforms from various historical periods; the coat of arms of Austria-Hungary is at top. Poster is announcement for a concert by Austrian and Hungarian soldiers to benefit widows and orphans. Details are given.","Poster showing soldiers and a field cannon against a brilliant red sky.","U.S. Marines recruitment poster showing marines coming ashore with ships in the background; also shows a series of views of marines engaged in training, educational, and recreational activities, as well as the \"Marine detachment, American Legation, Peking, China\".","Poster shows silhouettes of three flying eagles and is an advertisement for book about Field Marshall August von Mackensen's successful military campaign against Romania. A facsimilie of final paragraph of the book, hand-written by von Mackensen, is printed on bottom of poster.","Poster shows a soldier carrying a shovel, pickax and a rifle; in background a line of ships. Text is call for sappers to join the G. Cavalry Protection Division, Berlin. Benefits are listed.","Poster showing Liberty presenting a sword \"Service\" to a young woman; Liberty's shield is inscribed State & National Councils of Defense.","Poster shows an arm reaching down from sky with bills and coins in hand; below a landscape, with \"prosperity\" written over the rising sun.","A soldiers' home set in the woods. Outside soldiers are relaxing and playing games.","Poster showing a soldier standing on a map, reaching from France over the English Channel to take the hand of a civilian man standing on England.","Poster showing Uncle Sam, a man \"Wage Payer,\" and a man \"Wage Earner\" astride a missile \"Industrial Co-operation,\" with an eagle carrying a \"Victory\" banner above. A tiny bird comments, \"This shot will win the war!\"","Poster showing the flags of Great Britain, France, Russia, and Belgium.","Poster showing the flag of Great Britain.","Poster showing the flags of Great Britain, France, Russia, and Belgium.","Poster showing personifications of France and Great Britain, depicted in profile within a circular border.","Man holding a suitcase. In the background a crowd of cheering civilians. George de la Fouchardie\u0300re (d. 1946) was a French humorist and columnist. During the occupation he wrote for the newspaper 'l'Oeuvre.' The 'l'Oeuvre' ran popular war serials during the war.  Serials were the popular form of entertainment of the day.","Poster showing a worker cheering from the top of a flagpole, high above a shipyard.","Poster showing a map of Great Britain, with districts of army regiments indicated.","Poster showing portrait of King George V and a map of Great Britain as parts of a rebus.","Poster showing a civilian in overalls, wearing four Liberty Loan buttons, again reaching into his pocket.","Poster shows a German soldier pointing the way to others  silhouetted in background as though emerging from a trench. Poster is advertisement for a popular play by Heinrich Gilardone.","Poster showing a man in hat and overalls reaching into his pocket; he wears buttons from previous Liberty Loan campaigns.","U.S. Marines recruitment poster showing marines in a landing party; also shows a series of views of marines engaged in training, educational, and recreational activities.","Poster shows a mother holding her young son and an infant. Text is announcement of a charity concert on behalf of Germany's Fund for the Support and Protection of Young Children. Details of concert, including performers, are given.","Poster showing the Statue of Liberty seen above the New York harbor and skyline. The night sky and sunset create an American flag, of which Liberty's torch forms a star.","U.S. Navy recruitment poster showing \"Executive Order\" signed by Woodrow Wilson authorizing the increase of Naval strength to 87,000 men.","U.S. Navy recruitment poster showing \"Executive Order\" signed by Woodrow Wilson authorizing the increase of Naval strength to 87,000 men.","Poster shows a German soldier holding his rifle over his shoulder like a club; a bayonet appears in the lower left corner. The poster is an advertisement for a popular play by Heinrich Gilardone.","Poster shows a German soldier, holding a grenade in one hand and a rifle in the other; in background a barbed wire fence and flames. Text encourages enlistment in the G. Kav. Schu\u0308tzen Div. with the slogan \"Your Fatherland is in danger, register!\" Further text  lists benefits of joining the militia.","U.S. Navy recruitment poster showing a sailor pointing to a billboard while encouraging a young man to \"join the navy and see the world\"; also includes list of occupations available in the navy, reasons for joining the navy, and recruiting stations in Pennsylvania and Delaware.","Poster showing a priest looking heavenward and raising a crucifix, blessing kneeling soldiers.","Poster showing a YMCA canteen serving soldiers, with sign above the door, \"George Williams' House. In memory of Sir George Williams who founded the Y.M.C.A. over 70 yrs. ago. To the glory of God and Britain's young manhood.\"","Young man holding hand of mother, who is shaking hand of Uncle Sam.","Poster shows a woman holding a laurel wreath and army helmet in one arm and a laurel(?) draped sword in the other hand. Text: Help us win the victory crown. Subscribe to the War Loan.","Poster showing a pride of lions, with one lion posed heroically on a rock.","Poster showing Liberty shaking the hand of a sailor.","Poster showing a large V for victory, often used to promote Liberty Loan bonds.","An older man holding a young child while another child stands next to him. This office offered free service to help reunite families   of refugees and those that had been evacuated.","Poster showing popular Bert Thomas cartoon of a soldier lighting his pipe, rifle at hand, and asking the Kaiser to wait a moment.","Poster showing two soldiers, one holding an American flag, the other the flag of the Red Cross, and promoting loyalty to both.","A wounded soldier relaxing in an easy chair.","Poster shows a classical figure of a woman holding a sword in one hand and a scale of justice in the other. One side of the scale has a dove of peace, which is heavier than the side which contains coins. Text: Subscribe to the 8th War Loan.","Poster encourages people to give to the Ludendorff Fund as an expression of gratitude and sacrifice.","Depiction of Britain as a spider, German eagle sitting overhead, Uncle Sam and two others tied up in web in background. The Entente   Cordiale was a diplomatic agreement signed in 1904 by France and Great Britain which adjusted the colonial disputes between the two countries, and paved the way for Anglo-French co-operation against German expansion in Europe and in the colonial world.","Poster shows boy with hoe chasing fleeing vegetables to illustrate the success of growing food in local \"victory gardens.\" Part of the National War Garden Commission's campaign to encourage Americans to raise more food and free resources for the United States military needs in World War I.","Poster shows a man walking away from a gaming table and depositing money into a bucket marked \"Grenze-Spende\" which is held by a cherub; in background, two men sit playing cards. Text encourages people to give to the Bavarian Border Fund to keep Upper Silesia part of Germany. Establishments accepting donations are listed on bottom of poster.","Poster showing a figure of Liberty advancing, with shield inscribed, \"To make the world safe for democracy.\"","Poster showing a heroic military statuary group, beneath flags and the legend, \"United for liberty.\"","Poster shows a cannon, resting on a pile of coins, pointing upwards toward the mountains. Text encourages people to donate money for victory and peace.","Poster shows a huge figure in a Roman helmet tearing down the towers of Munich's Frauenkirche. Text: Christian people! Will you allow Spartakus to tear down your churches? Answer on election day! Bavarian People's Party.","Poster showing a soldier holding his \"Honorable Discharge,\" crossing a welcome mat to pass through door of \"Bureau for Returning Soldiers and Sailors.\"","Poster showing a hand about to pitch a ball labeled \"Second Liberty Loan of 1917\" at Kaiser Wilhelm with the caption \"Swat military autocracy.\"","Poster showing two bridges, the bridge of ships \"American Industry\" carrying supplies to the Allies, and \"Hyphen Bridge\" carrying \"Plots\" and \"Unrest\" between the United States and Germany. A tiny bird comments of the former, \"This is the bridge that will win the war.\"","Poster showing a mature, prosperous man reaching into his pocket as he watches soldiers and artillery pass by; caption, \"My duty.\"","Poster is a declaration by Reichstag party leaders that the government intends to honor the interest on war bonds. The names of party leaders appear on bottom of poster.","Poster tells women to care for peace and bread and to vote and campaign in the election.","Poster shows two angels holding a banner which declares Peace for the People, Friendship and Brotherhood! Away with hate! Remainder of text is a plea for cooperation and peace between Germans and Poles.","Poster showing a button with the Statue of Liberty and the motto, \"I own a Liberty Bond.\"","Poster showing an insignia for the Liberty Loan of 1917, which features the Statue of Liberty and the motto, \"Get behind the government.\"","Poster showing Liberty, in a red, white and blue liberty cap, soaring with a rainbow over a fertile landscape.","Four allegorical figures: Justice, Liberty (who is holding the   American flag), Demeter, and Athena above Saint Sulpice.","Poster showing soldiers marching, bearing rifles on their shoulders, behind an insignia of the Statue of Liberty with the legend, \"I own a Liberty Bond.\"","Poster shows a holy figure with arms extended upwards and wearing a robe decorated with a cross, standing on a pillar with flowers at the bottom. A white halo rings the figure's head. Text: Heroes of the front, your homeland greets you! You are heartily welcomed!","Poster directing people to save soap and oil and giving suggestions on how to do so. On verso, a request to display the poster in a prominent place.","Poster lists achievements since the end of the war: a people's republic; freedom of assembly, press and religion; hereditary privileges and dynasties swept away; militarism smashed; an eight hour work day; etc. Text declares that much has been achieved yet much remains to be accomplished, and tells people to close ranks and to show solidarity.","Poster shows a large chicken, two figures representing Great Britain and Canada, and four eggs, representing egg production in Canada and sales to Britain. Text continues: Very little eggs for such a big bird. Canada must do better.","A soldier holding a small wooden statue of winged victory that he has been carving. In 1916, the Ministry of Beaux-Arts and the   Ministry of War promised artists serving in the war, that their work   would be shown in official war exhibitions on the homefront. The   government sponsored the Salon des Arme\u0301es to show the work of the   mobilized artist and this exhibition realized 60,000 francs. These   proceeds supported not only needy artists at home but also the disabled. The striking contrast between the continuing French culture, even from within the trench, and the barbarianism of the Germans, was brought home by these exhibitions. This poster won first prize.","Poster shows city hall in Posen, Germany. Text: The German Association for Posen Refugees encourages people to join the local militia (Grenzschutz) to free the city of Posen from Polish tyranny.","Poster shows a medallion designed by Hermann Hosaeus with the motto: Gold gab ich zur Wehr, Eisen nahm ich zur Ehr. The medallion depicts a woman in profile holding a medal on a chain in her outstretched hand. Text urges people to increase German gold reserves by bringing jewelry to gold dealers.","Poster shows a village in flames with a large claw-like hand formed out of smoke posed over the buildings. Text encourages people to volunteer for the Eastern Border Protection Corps in order to protect against Bolshevism.","Poster shows a village in flames with a large claw-like hand formed out of smoke posed over the buildings. Text encourages people to protect the homeland by signing up for the volunteer corps of Generalkommando Lu\u0308ttwitz or the  Eastern Border Protection Corps.","Poster shows a hand holding a sword superimposed on Ko\u0308nigsburg Castle(?) tower which is surrounded by flames. Text: Help! East Prussians protect your homeland. Central Committee for the East German Homeland Service, National Association for East Prussia.","Poster shows a statue of the Virgin Mary(?) holding a shield on which the coat of arms of Bavaria is superimposed on the colors of Germany. Surrounding the figure are symbols representing aspects of life in Bavaria. Text: Bavarian People's Party, a strong Bavaria in a united Germany.","Poster shows a woman gazing lovingly at a bust of Kaiser Franz Josef and holding garlands of roses. Text announces an art exhibit to includes 80 original paintings representing various episodes in the Kaiser's life. All proceeds to benefit widows and orphans of the Armed Forces and the Red Cross. Location, hours, and entrance fee are given.","Poster shows a kneeling knight with a sword in one hand and a dove of peace in the other. Text declares the Kaiser's and people's gratitude to the Army and Navy.","Poster shows the German Imperial eagle superimposed over the Bavarian flag. Text: Bavarians, wake up! True Germans, good Bavarians, vote for the Bavarian Center Party (German National People's Party in Bavaria).","Poster shows a farmer sowing seeds. Text: Freedom, Peace and Work.  Elect the German People's Party in Bavaria (German Democratic Party).","Soldiers at the battlefront. Gustave Te\u0301ry was editor and publisher of the Parisian daily newspaper 'l'Oeuvre.' He was one of the most brilliant writers of editorial opinions in France. The 'l'Oeuvre' was an independent newspaper with socialistic tendencies.  It mostly contained commentary on the principal events of the day. Henri Barbusse (1874-1935) was a French writer and his best known novel was 'Le Feu.' Barbusse served in the war as a private in an infantry regiment and was cited twice for bravery.  After the war he became a correspondent for the Socialist newspaper 'L'Humanite\u0301' and became an ardent pacifist. About that time he, along with others, founded the Republican Association of Former Combatants, which was largely responsible for the split in the French Socialist party resulting in the organization of the Communist party in 1920. Barbusse joined the Communist party in 1923 and died in Moscow while visiting there.","Poster shows soldiers from Italy, Great Britain, France and the United States and t
