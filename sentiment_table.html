che Volkspartei, ein starkes Bayern in einem einigen Deutschland","Gema\u0308lde-Austellung \"Unser Kaiser\"","Kaiser- und Volksdank fu\u0308r Heer und Flotte","Bayern, wach auf!","Freiheit, Friede, Arbeit. Wa\u0308hlt die Deutsche Volkspartei in Bayern","L'Oeuvre de Gustave Te\u0301ry publie 'Le Feu' notes d'un combattant par Henri Barbusse","Per la liberta\u0300 e la civilta\u0300 del mondo"],["Poster shows a returning German prisoner of war, clutching his bundles and looking bewildered; in background are other returning prisoners of war. Text announces information, advice and help for returning prisoners of war. At bottom of poster is area where address of local information center can be inserted.","Poster shows a German prisoner of war holding a pick ax with a French guard and a barbed wire fence in the background. Text: Release our prisoners! Association for the Protection of Prisoners of War.","Poster shows a gaunt, starving woman seated with three starving children huddled near her and one starving or dead child(?) on her lap. Text exhorts people to volunteer for the local militias and protect the eastern German provinces, proclaiming that half the bread ration comes from the eastern provinces and half the coal ration from Upper Silesia, and without these provinces, Germans will have no heat, no light, no work and no life.","Poster showing man struggling with a snake. Text: Down with Bolshevism. Bolshevism brings war and destruction, hunger and death.","A foot soldier. Great Britain entered the war August 4, 1914 and by the end of the war over six million British soldiers had fought in the war. Of these, over seven hundred thousand had been killed by the war's end.","A family watching in distress as their farm is burned and animals confiscated. Text: Bolshevism brings distress, adversity, hunger and destruction.","Serbian civilians and military personnel crossing the River Drina in what is now Yugoslavia. King Peter is being transported across the bridge. The Battle of Kossovo was the last battle lost by the Serbians before they were forced to migrate into the Albanian mountains for the winter. Thousands died that winter from the horrible conditions and lack of food. Kossovo was also significant   because that is where the Serbians lost an equally important battle in 1389. This day was to benefit the Serbian Relief Fund.","Poster shows a figure of a man screaming and tearing his hair. Text: The enemy's cry of rage when the 8th War Loan becomes a new billion-victory!","Soldier standing in front of two workers. About five hundred   thousand French prisoners were held by the Germans between 1914 and   1918. An exchange of prisoners was negotiated in 1917, for those   prisoners over forty-eight years old, who had been held prisoner for at least eighteen months.","Poster shows a kneeling goddess(?), holding her arms as if in offering. Text: Prisoner of War Relief Fund. German Relief Organization for War- and  Civilian Prisoners of War.","Poster showing a devil, with two child-like devils, appealing to Kaiser Wilhelm II, who has a bloody sword extending from beneath his cape, that the Kaiser has left no work for them; on the left is a cave identified as \"Gehenna Apartments\", its openning covered with cobwebs, over which hangs a sign \"To Let\".","Poster showing a soldier gesturing amid the chaos of war, including civilians and dead bodies.","Poster shows two young men working at a forge, changing weapons into plows. Text: Weapons for death -- weapons for life! Subscribe to the Victory Loan.","Poster shows tombstone on which is carved an Iron Cross, a German soldier's helmet and birth and death dates, the death date indicating death occurred at Verdun. Text announces an exhibition and includes the Berlin address and viewing hours.","Poster shows a monster, an anarchist(?), holding a knife and a bomb. Text: Bolshevism brings war, unemployment and starvation. Association to Fight Against Bolshevism. Association's Berlin address is given.","Poster shows a large angel holding an olive branch and a scroll with the words \"National ...amlung\" standing in front of a mass of German soldiers and civilians. In front of the angel is an anarchist holding a knife and preparing to throw a bomb. Text: Bolshevism brings war, unemployment and famine. Association for the Fight against Bolshevism.","Poster shows a large angel holding an olive branch and a scroll with the words \"National ...amlung\" standing in front of a mass of German soldiers and civilians. In front of the angel is an anarchist holding a knife and preparing to throw a bomb. Text: Bolshevism brings war, unemployment and famine. Association for the Fight against Bolshevism.","A soldier standing on a battlefield wearing gas mask around his neck. Poison gas was first used in World War I. The phrase 'they shall not pass' is said to have originated with General Robert Nivelle (1856-1924) at the battle of Verdun in 1916.","Allied soldiers climbing up a rock including an American soldier on the left and a French soldier in blue.  Perched on top of rock is the German Imperial eagle and the Iron Cross.  America entered the war April 6, 1917 with approximately 50,000 men. By the time the war ended in 1918, about 114,000 U.S. soldiers had been killed.","A view of the burning ruins of Rheims Cathedral. The city of   Rheims was shelled with explosives and incendiaries by the Germans   during ten days in September of 1914 with the cathedral as the main  target. Outraged, particularly by the attack on the cathedral, the   government at Bordeaux sent an official protest. At the time of the  shelling the cathedral was serving as a hospital with a red cross   hanging from its tower.  The Germans, however, believed it was also used as an observation tower by the French, hence the heavy and unrelenting bombing. The Germans had eyewitnesses who corroborated this story, but the French consistently denied it. The tracery, towers, and nave of the cathedral were heavily damaged, but the walls were still intact.","Poster shows a distraught mother and her five starving children around a table. One child holds a bread box with nothing in it; another child cries. Text: Farmers, do your duty! The cities are starving.","Poster showing a mule \"Industry\" upsetting a cart as it is bothered by flies \"Unjust taxation,\" \"Agitation,\" Waste,\" \"Strife,\" and \"Unfair laws.\"","Poster shows a monster, an anarchist(?), holding a knife and a bomb. Text: Misery and destruction follows anarchy.","Poster shows a soldier standing next to prison bars; in the background a large red heart. Text: People's Fund for German War and Civil Prisoners. Collection days: July 1 - 7, 1916.","Poster shows a soldier standing next to prison bars; in background a large red heart. Text: People's Fund for German War and Civil Prisoners.","Poster showing a figure of Death reaching down from storm clouds to menace a devastated populace.","Kaiser pointing a dagger at a woman (Romania), while showing her the 'Traite\u0301 de Paix' and stepping on a man (Russia). The revolution in Russia in 1917 left Russia's army in chaos and put the Bolsheviks in power. The Bolsheviks made the decision to take Russia out of the war and the Romanians made the same decision. The Armistice or 'Traite\u0301 de Paix' was signed on December 15th. The terms were severe.","Poster shows two soldiers in hospital suffering the effects of poison gas; a distraught Red Cross nurse and older man look on. Poster drawn by Raemaekers for The Century Magazine and is part of Barron Collier Series of Patriotic Cartoons.","Poster showing the funeral procession of John Purroy Mitchel on Fifth Avenue, New York City. The ex-mayor was killed in a military training accident.","Poster showing a devil seated with his arm around the shoulders of Kaiser Wilhelm II, a devil-like figure who is holding a bloody sword; the Kaiser has a gloomy look on his face even though he is being praised by the devil.","Gen. Joseph Jacques Ce\u0301saire Joffre (1852-1931) points to the Route of 75, named after the front line soldiers who were called '75.' Acommemorative day for the front line soldiers was called 75 Day. The name derived from a special gun for the war designed by the French andcalled the 75 mm field gun.  It was a rapidly firing gun which was extremely accurate, and the term 75 referred to the men who manned it.","A foot soldier holding a rifle. In the background is a partial map of France. The map shows the Hindenburg Line in red ink. The poilu carried everything he needed on his back.  This would weigh up to 60 pounds. He entered the war with a soft military cap and a uniform with shiny buttons. It did not take long to realize that the enemy spotted the shiny buttons and found him an easy mark. The shrapnel from artillery fire or pieces from a thrown hand-grenade penetrated his soft military cap. Acid was found to dull the shiny military uniform buttons and a steel helmet quickly replaced the once soft military cap.","Poster shows a black eagle diving after a bullet-ridden, badly damaged British biplane which is plunging to earth. Text announces, under the title, Now for a short time only, an exhibition of spoils from the air war campaign. Location, hours, price of admission and other details are given.","Poster shows a wolf standing near a pool of blood in which a man is drowning; in background, destroyed buildings. Text: Bolshevism means the world will drown in blood. Association to Fight Against Bolshevism.","Poster shows piles of dead and dying people; behind them looms a skull in a Russian-style hat and coat. Text exclaims that the homeland is in danger from Bolshevism coming across the eastern borders and that large sums of money are needed for the protection of the eastern provinces.","Two posters addressing issue of returning prisoners of war. The first, Die Kriegsgefangenen kommen ... , addresses the issue of returning prisoners of war, stating that it is everyone's duty to perform their job and keep order to ensure the men have a quick return to civilian life. The second poster, Frauen! ... , instructs women how to behave to their returning soldiers by showing patience, sacrifice, and love, among other positive attributes.","Translation of title: Soldiers marching beside a river and over a bridge into a shelled Verdun. The battle of Verdun in 1916 was the longest and costliest battle -- in terms of lives -- of the war.","In the foreground is a family without a husband. In immediate background, there is a large American flag. At the left is a   wounded soldier, and on the right, is a peasant ploughing in the field. Approximately eight million acres of French land were devastated by the war.","Poster shows a sword, with an eagle perched on the hilt, plunged into a mound of earth. Below, a man plows the earth and a woman sows seeds. In the background are flames and smoke from factories. Text announces a war exhibit organized by the Wu\u0308rttenberg Red Cross and presented under the auspices of the King and Queen and the Royal Wu\u0308rttenberg War Ministry.","Poster shows a cherub(?) pouring coins from a bag; in the background a graph shows amounts collected at the various war loan drives. Text: Subscribe to the 7th War Loan at the local bank, all funds stay in the country.","Poster shows faces of Austrian actors. Text: Austrian Theater War Loan Day, May 31, 1917, We all subscribe to the War Loan.","Caricature of two devils, one of them being Kaiser Wilhelm II, looking at a monthly report of murders.","Poster shows a dead woman and child lying on ground. Poster drawn by Raemaekers for Century Magazine and is part of Barron Collier Series of Patriotic Cartoons.","Poster reminding people there are only four fateful weeks left to to subscribe to the 9th War Loan. Text continues: Germany will persevere -- the enemy will be taught a lesson!","Poster shows a father and daughter in hospital grieving next to body of dead woman; nurse and doctor are in background. Poster drawn by Raemaekers for Century Magazine and is part of Barron Collier Series of Patriotic Cartoons.","Poster shows a grieving woman clutching a child and infant; next to her stands an evil-looking man holding a blood-soaked knife. In the background a mass of people with weapons and a house in flames. Text: Is this what you want? Association to Fight Bolshevism.","War poster with the famous phrase \"I want you for U. S. Army\" shows Uncle Sam pointing his finger at the viewer in order to recruit soldiers for the American Army during World War I.  The printed phrase \"Nearest recruiting station\" has a blank space below to add the address for enlisting.","Poster shows profile of soldier wearing helmet. Poster is announcement of an exhibit of war art by painter Eduard Adrian Dussek from the battles at Izonzo, Triest, and Belgrad. Exhibit is to benefit the Austrian Military Widows and Orphans Fund and the Homes for Soldiers Blinded in the War.","A bloody Kaiser with a large spider and web over his head. In the background is a deserted and bloody battlefield.","Poster shows profile of soldier wearing helmet. Poster is announcement of an exhibit of war art by painter Eduard Adrian Dussek from the battles at Izonzo, Triest, and Belgrad. Exhibit is to benefit the Austrian Military Widows and Orphans Fund and the Homes for Soldiers Blinded in the War.","Poster showing a soldier on the battlefield, collapsing and clutching his throat as a result of poison gas.","Poster showing soldiers in hand-to-hand combat. Text: Down with the murderers! Up with Democracy!","Poster shows a farmer cutting grain with a scythe; in background, haystacks, a city, a river, factories, mountains and a rainbow. Text announces the 9th War Loan with a poem: Germany has perpetuity, it is a sound country, therefore, Germans, subscribe to the 9th War Loan. Subscriptions accepted at Bankhouse Baruch Strauss, Marburg an der Lahn and Frankfurt am Main.","Poster shows a man, woman and child looking at ruins of a town(?). Text tells people to subscribe to a type of loan. Poster is sponsored(?) by the Cooperative Alliance for War Reparations.","A village destroyed by war.","Poster shows a German land\u002fsea biplane, the \"Wolfschen\", flying over Africans(?) who appear to be reacting with fear. The text announces an exhibition in Munich of items captured in the air war and gives details as to time, place, and concerts performed as part of the exhibition.","Poster showing caricatures of Germans, including wartime scenes of past violence, cruelty, and drunkenness, and then a charming German businessman of the day. Also a vignette of martyr Edith Cavell's grave and the caption, \"1914 to 1918. Never again!\"","Poster shows a kneeling woman pleading with an angry man; between them a frightened child clings to his mother. Text: Shall this misery continue? Life's possibilities only happen with a just peace.","Poster shows a medieval knight with a shield bearing the Austrian coat of arms, protecting a crouching woman with her child. Swords and\u002for pikes, some broken, are pointed at the knight. Text: Subscribe to the 5 1\u002f2 % Third War Loan.","Poster shows German men working in a field being threatened by African soldiers as a French officer looks on. Text encourages people to fight to the last since everything would be lost in a French-English victory; that French parliamentarians stated that Germans would be slaves in French-English forced labor camps.","Poster showing soldiers in battle, firing their weapons.","Poster shows a pensive German soldier resting his head on his fist. Text announces an exhibition of artwork by German prisoners of war held in Switzerland. Location, times, and entrance fee included.","Poster shows a winged goddess, in a chariot pulled by four horses, holding a laurel wreath as she crushes three dragons. Text: Subscribe to the 8th War Loan.","Poster shows a winged goddess, in a chariot pulled by four horses, holding a laurel wreath as she crushes three dragons. Text: Subscribe to the 8th War Loan.","Poster shows soldiers and their weapons behind a barricade of Austrian coins. Text: Subscribe to the 7th War Loan, Vienna Commercial Bank.","Poster shows a German soldier standing guard(?) by a collection of military gear and weapons, including a helmet, sword, shield, armor, flag, cannon balls, and a cannon mounted on a caisson. Text announces a war exhibit arranged by the German Red Cross Associations, opening January 1916 at the Exhibition Halls am Zoo (Berlin).","Nurse bringing a bowl to a sick man lying on a chaise lounge.","Poster showing a woman wearing a crown, representing Berlin, dancing with a skeleton. Text: Berlin, stop! Come to your senses! Your dance partner is Death.","A French soldier (possibly Poulbot) in a prison camp sketching as he watches the other prisoners unload packages, presumably of clothing, as the German guards watch them.","Caricature of two devils, one of them being Kaiser Wilhelm II, holding bloody sword, being congratulated by the other.","Poster advertises latest war film \"On the Italian Battlefield between Brenta and Piave.\" Film title is written over a coat of arms.","A man in 18th century clothes. In the background World War I soldiers on a battlefield.","'Victory' flying over the battlefield and bringing the allies   into the war.","Poster showing a handwritten letter, on letterhead \"War Office, Whitehall, S.W.,\" which reads, \"I have said that I would let the country know when more men were wanted for the war. The time has come and I now call for 300,000 recruits to form new armies. Those who are engaged on the production of war material of any kind should not leave their work. It is to those who are not performing this duty that I appeal. Kitchener.\"","Print shows African American soldiers fighting German soldiers in World War I, and head-and-shoulders portrait of Abraham Lincoln above.","Poster showing a full-size artillery shell on which is a portrait of Kaiser Wilhelm II, the German national eagle, two images of bomb damage to French fortifications, and the inscriptions Unser Bombenerfolg; Lu\u0308ttich gefallen am 7. August 1914; and Originalgro\u0308sse des 42 cm. Geschosses.","Poster showing a soldier standing in snow, holding a mug from which steam is rising and eating a piece of pie, he has a big smile on his face. Also shown are emblems from the following organizations: War Camp Community Service; National Catholic War Council; YWCA; American Library Association; YMCA; Jewish Welfare Board - U.S. Army and Navy; and The Salvation Army.","Poster shows a blind soldier being led by a soldier with his arm in a sling. Text announces a Christmas exhibit to benefit war invalids, particularly the blind. The exhibit is sponsored by the Social Society of Munich Artists; exhibit location and times are given.","Poster showing soldiers firing machine guns, with stream of War Savings Stamps forming the cartridge.","Picture of the Imperial eagle stabbed by a sword with an empty battlefield in the background. The Liberation Loan realized 22 million francs.","Poster shows a man behind bars. Text: Free our Prisoners! Join the People's Alliance for the Protection of German Civilian and War Prisoners.","Poster showing a man making a machine gun and soldiers firing a machine gun.","The French army entering the city of Strasbourg. The Strasbourg Cathedral is to the left in the background. Strasbourg was the capital of Alsace-Lorraine. After the Franco-Prussian War Napolean III agreed to return Strasbourg to Germany in the Peace of Frankfurt of 1871. The cathedral itself had been damaged through the centuries by different wars and peoples. It was totally renovated in the late 19th century after the Franco-Prussian War and it was returned to France as part of the peace settlement along with Alsace and Lorraine.","A hand is holding a thread that is tied to a knife labeled 'La Tuberculose' suspended over laurel branches. The epidemic of tuberculosis was particularly severe in France and, although it began to decline shortly before the Great War, deaths from the disease were still quite high through the years between the wars.","Poster has no text. Possibly relates to the first general election after the end of World War I.","Poster shows a wounded Australian soldier standing over the body of an enemy soldier; in background, ships in the sea. Poster is possibly a reference to the battle at Gallipolli.","American Red Cross poster showing a Red Cross nurse holding an infant and comforting a woman amid the destruction left by war.","Poster showing a German soldier carrying a rifle and a bloody knife, walking amid ruins.","Poster shows a picture graph of what Germany will lose if Silesia becomes part of Poland, including land mass, population, coal production, grain and potato production, steel production, all colonies and the merchant marine. Text: What we will lose!","Views of  Serbian soldiers and civilians as they migrate into the mountains. The remains of the Serbian nation, approximately   700,000 people, who after their severe defeat by the Austro-German army, fled to the mountains of Albania in the winter of 1915 with many thousands perishing along the way.","Poster shows a shepherd with his flock near a barbed wire fence and artillery piece on an abandoned battlefield. Poster is probably an advertisement for a book by William Ernest Henley sold at Derry & Toms department store in London.","Poster showing Uncle Sam shaking hands with a clock-headed figure. The clock face reads \"One hour of extra daylight,\" and the figure wears a \"War service medal.\"","Poster showing a soldier reaching out above the chaos of battle.","Poster shows a skeleton, wrapped in a black cloak, with a bloody knife held in its teeth. In the background a hill of crosses on top of which is a gallows. Text: The danger of Bolshevism.","Poster shows face of German soldier. Text: Subscribe to the war loan! The Army and Navy expect it from you!","Poster shows a civilian man and a soldier watching Munich burn. Text: Bavarians! Your land is burning! Reference is probably to Communist attempts to take over the Bavarian government immediately after the war.","Poster shows a medieval knight with the Austrian Imperial eagle on his tunic, standing in front of an Austrian banner, with his sword raised as if about to strike. Text tells people to subscribe to the 5th War Loan at the Z\u030civnostenska\u0301 bank in Prague or one of the branch banks.","Poster showing a mule \"Industry\" on a treadmill powering a factory, which is producing \"Shoes,\" \"Drugs,\" \"Clothes,\" \"Hats.\" The mule is bothered by flies labeled \"Strife,\" \"Unfair laws,\" \"Agitator,\" and \"Taxation.\"","Poster shows a Valkyrie(?) and the German Imperial eagle protecting the German people. Text is a statement from Kaiser Wilhelm concerning the war and encouraging each German to contribute in their own way to the war effort.","Poster showing the devil dressed as a German soldier sitting on a mound of skulls; a bloodied sword rests at his feet.","Poster showing a dead soldier on the field.","Poster shows a wounded German pilot standing in the cockpit(?)of an airplane. Text: And you? Subscribe to the War Loan.","Red Cross recruitment poster showing a nurse on a battlefield with a wounded soldier appealing to a nurse seated at a desk; in the background, soldiers charge into battle.","Angry babies marching with placards, demanding their rights.","A street scene from an impoverished area. The Grim Reaper is looming in the background.","Poster shows a soldier in a trench; in the background are warships on the sea. Poster announces a military display in the Prater including a reenactment of a naval battle with war ships, a trench, military music and other attractions. Details are given.","Poster shows a medieval warrior about to slay a roaring lion. Text: It is essential that the last blows achieve victory! Subscribe to the War Loan.","Poster shows a medieval drummer before a walled city. Text: Subscribe to the War Loan! Viennese Bank Association.","Text: Subscribe to the War Loan!","Poster shows a cherub holding a German army helmet filled with coins. Text: For the War Loan!","Text: Subscribe to the War Loan!","Poster shows a clenched, ironclad fist. Text: That's the way to peace --  the way the enemy wants it that way! Therefore subscribe to the War Loan.","Poster shows a clenched, ironclad fist. Text: That's the way to peace -- the enemy wants it that way! Therefore subscribe to the War Loan.","Poster shows a farmer and his wife(?) plowing. A soldier standing next to the farmer motions toward other soldiers in the distance. Text: Subscribe to the War Loan!","Algerians and Tunisians on horses charging into battle. Algeria and French West Africa added about half a million men to the French fighting forces.","Poster showing refugees outside a devastated town, gazing up at a Marian apparition, Our Lady of Czenstochowa.","Poster shows a marching drum. Accompanying lengthly text describes the growing Communist threat to Germany, admonishes people not to support Bolshevism, and to register at the local Berlin militia.","Poster announces an exhibit of images of the war at the Ku\u0308nstlerhaus, Vienna, Austria.","World War I public service poster showing two bare-foot children with a wheelbarrow full of vegetables.","Poster showing savings stamps, how to collect 31 of them on a card, and how to use the card to purchase a War Savings Certificate redeemable for \u00a31 after five years.","Poster shows the doubled-headed Austrian eagle, holding a sword in its talons.Text announces the fourth war bond drive.","Poster showing a soldier with rifle looking into the distance, as a man and horse plow a field in the background. Text: Subscribe to the sixth Austrian war loan.","Poster showing Belgian workers restoring a bomb damaged church.","Poster showing a Red Cross nurse holding a young girl, with four horsemen representing war behind.","Poster showing savings stamps, how to collect 31 of them on a card, and how to use the card to purchase a War Savings Certificate redeemable for \u00a31 after five years.","Poster shows a building. Text announces a war exhibition at the K.K. Prater Kaisergarten.","Poster shows the Austrian-Hungarian double-headed eagle with a sign 7. Kriegsanleihe around its neck. Text: Everyone subscribe to the 7th War Loan.","Poster showing a man smoking a cigarette as he looks over his War Savings Certificates, with caption, \"Paid off.\"","Poster shows a Canadian soldier holding a drowned Red Cross worker and raising his fist at the sailors on the nearby German submarine. Poster is a reference to the sinking of the Canadian Red Cross transport ship Llandovery Castle.","Poster shows a dragon, with its neck through a figure eight, pierced by eight arrows. Text: 8th War Loan.","Poster shows a German soldier holding a child in his arms, behind him is a woman and child(?). Text: Fatherland, family, future ... 8th War Loan.","Poster shows a stylized German flag(?). Text announces a war exhibition sponsored by the Central Committee of the Association of the German Red Cross and the Hamburg Regional Association of the Red Cross. Location, dates, and entrance fee are given.","Poster showing hands overflowing with coins, which turn into bullets as they fall, against background of a war loan scrip voucher.","Poster shows a 16th century soldier holding up a flag with the Austro-Hungarian double-headed Imperial eagle on it. Text: Subscribe to the 4th Austrian War Loan.","Poster shows a black eagle sitting on the wing of a downed British biplane. Text announces an exhibition in Munich of the spoils of the air war.","Poster shows a woman and a man, each holding a cornicopia of fruits, flanking a flame. Below, cherubs sit on a bed of flowers. Text announces the sixth war bond drive.","Poster showing a German soldier; in background, a woman surrounded by her children. Text reminds Altoners to contribute to war aid on Altona's Offering Day.","Poster showing a father with children, as they look at war savings certificates.","Text: You can subscribe to War Loan here. Closing: Oct. 18, 1 pm.","Poster urges people to give to the Ludendorff Fund for War Disabled, saying \"They have bled for you.\"","Poster shows a woman, representing the Austro-Hungarian Empire, holding a flag.Text announces the seventh war bond drive.","America entered the war April 2, 1917.","Poster shows face of a soldier. Poster solicits subscriptions to the 7th Austrian War Loan and gives locations in Vienna where subscriptions can be purchased.","Poster shows a knight on horseback, with the Austro-Hungarian banner behind him, slaying a dragon. Text: Subscribe to the 6th War Loan.","Poster shows a woman, the personification of Italy, with her arm around a war veteran's shoulders as she gestures to factories in background. Text: Work - the new duty.","Poster showing a cartoon from the Chicago Evening Post of a farmer waving a banner \"War Gardens\" as his cannon made from a bushel basket fires produce and a German figure sky high.","Poster shows head of a goddess(?) wearing a crown in the shape of a castle or fort. Text: Subscribe to the 8th War Loan. K.K. Priv. Wiener Bank Verein.","Text: Today everyone should wear the Ludendorff-Pin for the war disabled.","Poster announcing final drawing of the war loan on Wednesday, October 18, at 1:00 pm.","Poster shows a table, chair, lamp and picture on wall. Accompanying text announces housegoods available, including on installment plans, at the \"Hausrat\" Gemeinnu\u0308tze Gesellschaft m.b.H. to spouses of veterans, those diabled by the war, and families with many children in Greater-Berlin and the province of Brandenburg. Directions are included.","Poster shows a medieval knight standing behind a laborer. Text announces an exhibition by the Vocational School for War Invalids. Location, times, and entrance fee are given.","Poster shows Canadian soldiers in trucks driving over a road paved with war bonds.","Poster declares that without order there is no bread, that disorder brings starvation. A quote by Andrew Bonar Law, Leader of the British House of Commons, is included. Poster sponsored by the German Armistice Commission.","Poster shows a soldier drawing on a canvas while sitting in a trench(?). Text announces an exhibit of posters drawn by soldiers for the 8th War Loan. Directions to, and hours of, the exhibit are given.","Poster showing soldiers and others busy with war work, as a well-dressed man looks on pensively.","Poster shows the bandaged and bleeding head of a soldier. Text: And your duty? Subscribe to the war loan.","Poster showing a young man in uniform, posed with a drum, before a wall displaying enlistment posters by the Parliamentary Recruiting Committee. Some of the posters are recognizable as items in the Library of Congress World War I poster collection.","Poster showing Uncle Sam with a soldier and a man purchasing War Savings Stamps.","Poster showing a cross surrounded by extensive text requesting contributions to the Presbyterian Church's war efforts. Also four small scenes of a soldier saying goodbye, a church, a military camp, and a Navy ship offshore.","Poster shows wounded German soldier; in background a large red cross. Text: Red Cross Collection Drive 1914. Collection to Aid volunteer nursing in the war.","Poster(two sections) shows view from back of a German biplane, \"Delka\"(?), with a pilot in the cockpit. The poster announces an exhibition in Munich of items captured in the air war and a garden concert, and gives location and opening and closing times.","Poster showing soldier unfurling red \"War until victory\" banner.","Poster shows a crowd of people on a plaza in front of a bank. Text: National War Loan.","Poster shows head of a goddess(?) wearing a crown in the shape of a castle or fort. Text: Subscribe to the 8th War Loan. K.K. Priv. Wiener Bank Verein.","Poster shows Austrian officers and soldiers standing on a hill looking toward a river in the distance. Text: Subscribe to the 8th War Loan.","Poster shows four men, representing various classes of Austrian society - professional, laborer, farmer, and student(?) --, holding a flag pole. Text: Subscribe to the 7th War Loan.","Poster shows a large Roman helmet. Text announces an exhibition \"Art in War\" in Berlin. Location, dates, and entrance fee are given.","Poster shows an island of factories blockaded by war ships of various countries. The factories produce a large cloud from which a man's upper torso emerges. He is heating a test tube over a flame. Text announces an exhibition of surrogates. Location, dates, times, and admittance price given.","Poster shows a rabbit holding a sign in its mouth. Text tells people to turn in their rabbit pelts to traders and breeders; the Army needs them. Collection center, War Pelts (Kriegs-fell) A.G., Leipzig.","Poster showing a young factory worker in overalls holding a Canada War Savings Certificate booklet.","Poster shows an armor-clad arm holding a sword; in background a red globe. Text announces a war exhibit to aid the Red Cross.","Poster showing savings stamps for war bonds.","Text: Subscribe to the 8th War Loan.","Poster showing soldiers with rifles and bayonets, charging. Text: Fifth war loan.","Poster showing six scenes of activities sponsored by the American Library Association Library War Service, including interiors and exteriors of facilities, and military personnel reading and studying.","Poster showing numerous scenes of activities sponsored by the American Library Association Library War Service, including interiors and exteriors of facilities, and military personnel reading and studying.","Poster shows a biplane dropping signs \"Zeichnet 8te Kriegsanleihe\". On ground are trains, the one on bottom of poster, with sign Odessa-Kiev-Vienna, is crossing a bridge. Text: Subscribe to the 8th War Loan at your savings bank.","Poster showing Uncle Sam offering War Savings Stamps to a boy and girl.","Poster shows a soldier in a trench holding a grenade. Text: And you? Subscribe to the 7th War Loan at the k.k. pr. O\u0308st. Creditanstalt f.H.u.G.","Poster showing a submarine \"U agitator\" firing a torpedo \"Strife\" at a ship \"American industry,\" with \"Europe\" burning in the distance.","Poster shows a large number seven. Text: Subscribe to the 7th War Loan.","Poster shows an elf in the forest with a basket. Text: If you want oil, then collect beech nut seeds. War Committee for Oils and Fats (Kriegsausschuss fu\u0308r O\u0308el und Fette).","Poster showing an eagle perched on a German flag.Text  encourages people to donate to the war fund on the anniversary of the Battle of Tannenberg.","Scene depicting French women in war-time. One woman is working in a factory, one is nursing her child, and another woman is hoeing in the field. In the background is an outline of Victory. French women made up over 40 percent of the work force during the war. Over two million were recruited into positions in heavy industry. Films were used for the first time as entertainment at Les Foyers du Soldats for soldiers on leave, and also to keep the homefront abreast of activities of the war in a romantic and humanizing way.","Poster showing a squirrel hiding nuts in a tree.","Recruiting poster for the Cold Stream Guards shows various uniforms worn by the Guards. In each corner are vignettes of the Guards on duty in London and on each side is listed the campaigns in which the Guards fought. Other regimental references are included.","Picture of a hospital ship being torpedoed; smaller pictures   commemorating torpedoed ships. A reported twelve hospital ships were sunk by the Germans either by mistake, due to unclear markings of the ships, or intentionally by German submarines.","Rear view of an Alsatian woman and her two children. They are on a hill overlooking a cemetery full of soldiers' graves. This poster is a call to the Alsatians to support the war.","Poster showing a woman and children, cowering in distress.","Poster showing a soldier, with a battle in the background, shaking hands with a worker, with an industrial landscape in the background.","Poster shows a prosperous-looking German standing in front of a home and a dejected-looking Polish family walking. Text: In Germany continued prosperity; in Poland poverty and emigration.","Poster shows the ghost of a sailor with his arm around a soldier. He is pointing to a sinking submarine. Text encourages people to subscribe to the war loan.","Two men, one wounded and one sick.","The imperial eagle, which is representative of the Central Powers, and the Gallic cock, a symbol of France, facing each other on a battlefield.","Poster showing fighter plane in flight, with man standing to fire mounted machine gun.","Poster showing a woman carrying a baby on her back among destroyed buildings.","Poster showing a soldier with a machine gun in the heat of battle, reaching out for ammunition.","Mother holding two children; in background is the destroyed region of Aisne.","Victory, with her arm around a boy who is carrying a basket of fruit through a wheat field. A ruined village is behind them.","Poster showing refugees in a ruined street.","A large gold coin with the Gallic cock on it crushing a German soldier.","A French soldier with gun in one hand, and the other raised urging his comrades on. This was the most remembered French poster produced during the war.","A French soldier with gun in one hand, and the other raised urging his comrades on. This was the most remembered French poster produced during the war.","Poster showing a portrait of a soldier, suspended as a pendant from a ribbon.","Poster shows an infant lying on a pillow and covered with a comforter. Text announces Diaper Week, an emergency call to the women of Braunschweig to collect diapers and clothing for infants and children. Clothing drive sponsored by the Braunschweigischer Landesverein fu\u0308r Sa\u0308uglings- und Kleinkinderfu\u0308rsorge.","Small drummer boy leading troops into battle. Large figure of Marianne looming in the background.","Poster shows General Paul Emil von Lettow-Vorbeck on horseback leading African soldiers. Text at top reads Colonial War Funds; on bottom is facsimile of von Lettow-Vorbeck's signature.","Poster showing victims in need of war relief.","Poster showing a monumental female figure with a tray of food, poor women and children at her feet, with the skyline of New York City in the background.","Poster shows a man blowing a bugel and holding a large mallet while surrounded by flames. Text addresses non-participating voters in Du\u0308sseldorf, stating that by not voting they are prolonging the suffering and delaying the return of order. It tells people to get to the election center and vote.","Poster showing a mother resting her head on an empty table in despair, as her children look on.","Poster showing a light bulb in suspended socket with pull-chain.","Poster showing faces of three little children, one consoling another who is crying.","Poster shows a little girl reaching through a number 8 to deposit a coin into a pile below. Text: Subscribe to the 8th War Loan.","Poster showing a man with axe and rifle joining a battle.","Marianne in French Revolutionary dress carrying and beating a drum.","An Alsatian woman with her hand chained to a brick wall. Alsace and  Lorraine were lost to Germany in the Franco-Prussian war of 1870-71.","An Alsatian woman with her hand chained to a brick wall. Alsace and Lorraine were lost to Germany in the Franco-Prussian war of 1870-1871.","Poster showing the Kaiser and the King of Romania arguing while examining a map.","Poster shows a flying bell with wings; sunlight streams in the background. Text: I ring for war, I sing for victory. With an open hand, you will protect the land. Subscribe to the 8th War Loan.","Two men arguing with two children standing behind a policeman.","Poster shows emaciated human figures, representing various diseases, cower beneath a partially nude female figure, representing venereal disease, chained to a vulture.","Shells and gold coins heading towards a German soldier on the battlefield. In 1914, the French were 'invited' to exchange their   gold for paper. Gold was needed to pay for foreign imports.","Picture of a German soldier (a Hun) carrying a torch and a bloody knife, and a salesman. They are one and the same person.","Poster showing a woman clutching an infant as a German soldier with bloody hands approaches.","Poster showing soldiers smoking pipes and cigarettes as they march past a damaged church.","German soldier with bloody bayonet and fingers.","Wounded soldier in foreground. Civilians in line at a cashier's window in background. The National Defense Loan was the first   defense loan of the war.  This loan realized 13 million francs.","Poster showing soldiers marching past ruins.","Ordnance Dept. recruiting poster showing the Kaiser, holding a bloody sword, cowering in the shadow of a young woman typing.","Poster showing a small girl sitting amid ruins, holding a bouquet of forget-me-nots.","A nurse holding a young child to advertise a vaccination program that began in France in the 1920s. The Commission G\u00e9n\u00e9ral de Propagande was created in 1926, and the  national archives of France dates its copy of the poster as \"before 1930. (Until 2025, this poster was incorrectly cataloged as being a World War I poster.)","Poster shows Franz Joseph I (1830-1916) and Wilhelm II, German Kaiser and King of Prussia (1859-1941), wearing masks and carrying bloody knives. In the background is a large outline of the Imperial eagle with blood dripping from his talons.","Poster showing soldiers smoking outside a damaged church, as other soldiers march by.","Poster showing a gaunt mother and children, with others, among ruins.","Picture of a German soldier (a Hun) carrying a torch and a bloody knife, and a salesman.  They are one and  the same person.","Poster showing soldiers smoking outside a damaged church, as other soldiers march by.","Poster shows a medieval city gate. Text: Give for our heros! Street collection for the DRK (Deutsches Rotes Kreuz) War Aid Work, 27\u002f28 June. Emblem: the old city gate.","Poster shows a woman in a red gown (Trieste) and a woman in a green gown (Trento) kneeling before a woman in white gown and crown and holding a sword (Italy); in background soldiers march to battle and planes fly overhead. Text: At last!","Poster shows German soldiers, one on horseback, advancing into battle with banners and flags, including a Turkish(?) flag. Text: German flags flutter high in the wind! Additional text states that sacrifice at the front and at home will bring victory.","Poster showing a woman holding a child; in the background a soldier and a German town. Text: Subscribe to the ninth war loan! It is for everything we hold dear!","Poster shows one red and one gold lightning bolt(?) cutting across a military(?) banner. Text encourages soldiers to subscribe to the 9th War Loan.","Poster showing starving women and children.","Poster shows four plates of butter, representing the amount of butter Canada sold to Great Britain before the war, the shortage of butter in Britain due to the war, and how much butter Canada has sold twelve years ago and the amount sold two years ago. Text below: Canada must do better than this. \"Keep Britain's Butter Plate Full.\"","A civilian propaganda poster showing boys and girls raising sheep, above them are sheep walking along a roadway that leads to the top of the poster where a battle is underway.","A German soldier escorting an unhappy group of people through the streets. The Germans deported more than 120,000 Belgians back to   Germany, and relocated about 20,000 French within the invaded French territories.","Poster showing a German soldier crushed by a monumental coin.","Poster soliciting contributions for the American Ambulance in Russia, 527 Fifth Avenue, New York, showing a Russian soldier with a look of dismay and gesturing towards an ambulance in the background.","A soldier with an injured arm painting toy soldiers.","Children picking flowers and handing them to injured soldiers. Flowers frame the scene.","Marianne in French patriotic colors holding a collection cup for the Red Cross. Holding on to her other arm is a blind soldier, who is smoking, with a cane.","Poster showing a Red Cross nurse attending an injured man and his family.","A blind soldier holding a small girl.","Poster shows a skeleton holding a sheaf of wheat looming over buildings at a port; three men are in lower right corner. Text: Coal is bread.","Poster showing a man lifting an injured man.","A French soldier in battle waving a small red and white flag.","French Revolution scene. In foreground a French general has his arm around a half-clothed Marianne. The French were victorious at Battle of Valmy in 1792 where they beat the Austrians.","Poster for a fundraising event, showing a battle scene with a tank.","An American soldier standing with two children at the grave of a French soldier.","An American soldier standing with two children at the grave of a French soldier.","Poster showing Britannia, who points to a Church Army Recreation Hut surrounded by soldiers, near a battlefield.","Two scenes. One of a soldier on a battlefield. The other of a couple taking their gold pieces to a bank.","A French soldier standing on a battlefield holding a rifle and about to throw a grenade. The use of the grenade was first introduced during WWI.","A woman holding a collection cup with scenes of soldiers going into battle in the background.","A man in Algerian dress on horseback. Algeria and French West   Africa sent 500,000 men to fight for France.","A soldier pointing a finger at the viewer.  Battle scene in background.","Poster showing a boy plowing, with a battle in the background.","Poster showing an outline map of Ireland, with detail maps showing locations of noted battles.","Poster showing a wounded horse on the battlefield.","Poster showing soldiers in battle at Neuve-Chapelle, France.","Poster showing men on a battlefield with an American flag, against a red sky.","A large tank emerging out of a trench onto a battlefield.","A large tank emerging out of a trench onto a battlefield.","In the foreground are French soldiers in the trenches. The background  depicts scenes of the battlefield and the enemy's trenches.","'La Marseillaise' going into battle with the French soldiers.","French soldiers on a battlefield; includes vignette of mother surrounded by children, reading letter.","Soldiers from the different allied forces each carrying their country's flag into battle.","A French soldier standing on a battlefield holding a rifle and about to throw a grenade. The use of the grenade was first introduced during WWI.","Poster showing a civilian rising from his desk and putting on his coat, as a man in uniform opens the office door to reveal a battlefield.","Poster shows the ship HMS Victory, flying the signal \"England expects that every man will do his duty,\" which was Nelson's signal before the Battle of Trafalgar. (Source: C. Seavey)","Poster showing a large cannon in battle.","U.S. Marines recruitment poster showing a group of marines rushing into battle carrying the American flag and the flag of the Marine Corps.","Poster shows silhouette of soldiers, bayonets drawn, in battle.","In the foreground is a large Red Cross flag. In the background is a silhouette of a battlefield.","Poster showing a battle scene with Allied tank, trenches, and airplanes.","New Jersey Dept. of Health poster showing soldiers rushing into battle and a woman holding an infant, a child standing next to her, and the faces of infants drawn in the background.","Red Cross recruitment poster showing a Red Cross nurse dragging a wounded soldier from the battlefield.","Woman of the Salvation Army carrying food on battlefield.","Poster showing a contemplative young woman, a family group, and a poem by Ella Wheeler Wilcox extolling male virginity before marriage to prevent health problems related to sexually transmitted diseases.","Poster showing a wounded soldier on the battlefield, carrying several German helmets as trophies.","A French soldier standing with the deceased soldier's family at his grave.","Poster showing a rear view of a soldier facing battlefield.","Poster shows a rear view of a soldier facing battlefield.","Poster shows Canadian soldiers, with bayonets drawn, going into battle.","A peasant woman and child harvesting hay. In background soldiers going into battle with Marianne urging them on.","Poster shows soldier in battle with vignette of hockey game rising from his smoking rifle.","Poster showing a Christ-like figure in a battlefield, gazing up at the sky.","Poster showing a soldier in a battlefield, gazing up at a cross glowing in the sky.","A small boy and girl standing over a grave.","Soldiers on horses at edge of battlefield. One soldier is carrying an American flag and another is carrying a French flag.","Three soldiers (French, American, Italian?) charging into battle. A winged figure of Marianne is above them pouring out coins and paper money from a cornucopia.","A soldier and a woman in a bridal outfit standing in the midst of a battlefield with soldiers looking on.","Poster shows silhouette of soldiers in battle.","Poster shows a soldier with rifle on shoulder pointing at viewer. Original text (LC's poster has none): I'm going to the Front. Have you subscribed to the 6th War Loan yet?","Poster showing a grave marked by a cross and a helmet, on a hillside of red poppies.","Gen. Ferdinand Foch (1851-1929) overseeing his troops as they march across the battlefield. Foch was appointed commander in chief of the Allied armies in 1918.","Poster showing a man in Knights of Columbus uniform gesturing toward soldiers in battle.","Poster shows a woman standing in front of a tattered Australian flag. Poster is probably a reference to the battle at Gallipolli.","Poster showing cavalry in battle, with horses reacting to an explosion in the foreground.","Poster shows a Grenadier Guard; in background the Guard's Armoury and a vignette of soldiers in battle.","A poilu embracing a girl. Behind them is a sewing machine, and a tipped chair; a little dog is in the left-hand corner. Caption:   Enfin seuls . . .!  Alone at last . . .!","A poilu embracing a girl. Behind them is a sewing machine, and a tipped chair; a little dog is in the left-hand corner. Caption:   Enfin seuls . . .!  Alone at last . . .!","Poster showing, in silhouette, a sailor and gun turret on a battleship.","Poster showing a farmer stopping his plow and removing his hat, as he looks up at a vision of St. Patrick with a cathedral in ruins.","Poster showing a U.S. soldier wielding a bayonet over a fallen German soldier.","Poster showing a man standing over a fallen German soldier.","Poster depicting American eagle fighting a large black German eagle, airplanes in sky.","Poster shows soldiers building a bridge while airplanes fly overhead; in background soldiers fighting.","Poster showing a wounded soldier with a rifle, standing over a fallen fellow soldier, and turning to a vignette of a rugby game in a stadium.","Poster showing a hand \"Strife, Excessive taxes, Unwise laws, Disloyalty, Agitation, Waste\" threatening an industrial district shaped like a heart. A tiny bird comments, \"Co-operation is what is needed most.\"","Three soldiers: one wearing a kilt, one raising helmet, one firing his rifle.","Poster showing a Marine carrying a mortar into combat, with American flag behind.","Poster showing a Marine carrying a mortar into combat, with American flag behind.","Title framed by vines with geographical names; coat of arms on top; weapons and helmet on bottom; scene of battle on top. The 4th National Defense Loan realized 22 million francs.","Poster showing large coast artillery batteries firing.","Poster showing Uncle Sam firing a cannon \"American industry,\" which is shooting supplies and munitions to \"The Allies\" on a distant shore. \"Wage earner\" and \"Wage payer\" look on.","Poster showing a scene of combat and a scene of a cigar smoking \"Agitator\" divided by the question \"Where do you stand?\" A tiny bird comments, \"And we need our industrial army to keep these boys in the field.\"","A U.S. Marine, in combat uniform, standing, full-length, facing front, holding handgun, against background of U.S. flag.","A French infantry soldier in uniform and with a gun. Surrounding him is a laurel wreath, and above him is the figure of 'La Marseillaise.'","Woman symbolizing America above naval gun crew in action.","Red Cross nurse with wounded and needy people, including a soldier and a mother holding a child, all gesturing toward the quote from Whittier.","Post-World War I poster promoting health in America, showing a soldier with an eagle perched on his shoulder.","Red Cross nurse with wounded and needy people, including a soldier and a mother holding a child, all gesturing toward the quote from Whittier.","U.S. Army recruiting poster showing officers and soldiers sending or receiving information through wireless and signal flags, other soldiers position and prepare to fire a cannon.","Poster showing men using a rivet gun.","Poster showing a man using a rivet gun, with the silhouette of a soldier in the background.","Poster showing soldiers firing from a trench, and a vignette of players on a soccer field.","American Red Cross campaign poster promoting the war fund showing large arm coming down from the sky.","U.S. Marines recruitment poster showing marines firing artillery from a ship.","Poster showing soldiers firing a cannon as a plane flies over.","Poster showing sailor loading gun.","Poster showing two scenes, of men arriving for work at a shipyard, and of a sailor firing on a submarine.","Poster shows a side view of a German soldier in battle. His rifle is slung over his shoulder and he has grenades in each hand; a bag of grenades also hangs from his shoulder. Flames(?) surround him. Text is title of film by the Milita\u0308risch Amtlicher (?) about the battle on the Aisne.","Poster shows head of a man wearing a medieval(?) head covering and a robe(?). Text is advertisement for a theatrical performance of three popular medieval plays (mystery plays?), The Fall from Grace; Dance of Death; and Theophilus the pre-Faust, to benefit the War Emergency Fund. Additional details are given.","U.S. Employment Service\u002fAmerican Red Cross poster showing U.S. Marines engaged in battle in France; also shows a badge listing battles in which the Marines fought. Poster is promoting veterans for employment.","Poster shows a kangaroo in front of number 50,000 and in background silhouette of soldiers in battle.","Poster showing a mule \"Industry\" kicking and snorting as it is bothered by flies \"Unwise laws,\" and \"Tax,\" and its food is infested with bugs, rat \"Waste,\" and snake \"Agitation.\"","Poster showing a figure rising from the sea to offer a sword, with a sinking ship and drowning victims in the distance. Refers to the sinking of the Lusitania.","Soldiers in various uniforms from Africa and the colonies, who fought for France.","Poster showing Marianne, personification of France, reaching out, as a cathedral burns under artillery attack.","The letters P and R and the no. 2 form a large backdrop for a seated wounded soldier and a woman holding an infant.","The Gallic cock in the foreground. Behind the cock is a statue of a mounted soldier [knight, Joan d'Arc]. In the background are the flags of the allies and a sunburst with the words 'Pro Patria.'","Poster showing an eagle and an American flag dominating the border, with blank space for inscribing names.","Poster showing Uncle Sam driving a wagon of supplies and munitions, \"American Industry,\" drawn by two horses \"Wage Earner\" and Wage Payer.\" A tiny bird comments, \"He had no use for a whip.\"","Poster showing scenes of gas warfare and first aid.","Design for a poster showing troops charging over a hill, with a graveyard in the background.","Print shows an angel kneeling beside picture of Edith Louisa Cavell, an English nurse, who was executed by the Germans in WWI for protecting and hiding Allied soldiers in a Brussels' hospital.","Poster showing half-length portrait of a woman in military uniform, and a trench warfare scene with troops carrying the U.S. flag and the flag of the Marines.","Poster showing Christ, a Red Cross, and a cathedral looming over a scene of ruins and casualties where a Red Cross nurse is helping.","A French soldier picking up medical supplies from the Red Cross. Two nurses in background. The Red Cross was one of three official charitable organizations of the war and the Red Cross was the only one allowed at the front.","Y.M.C.A. poster for the United War Work Campaign showing a man in military uniform pouring a cup of tea for a young soldier seated with a rifle across his lap and helmet at his feet; signpost with Y.M.C.A. logo in upper right corner.","Poster showing a man, representing the communist group Spartakus, strangling another man. A woman and child lie in a pool of blood beneath the victim. Text: Spartakus at work.","Y.W.C.A. poster for the United War Work Campaign showing a young woman seated at a switchboard with soldiers in the background.","Disabled French soldier being comforted by two young girls. Over four million French soldiers were wounded in the war.","Poster showing a forearm and fist, and cut to that shape.","Poster showing soldiers helping a sick horse out of an \"animal ambulance.\"","Poster shows an idealized image of a soldier swinging a large sword. Text: The last blow is the 8th War Loan.","Y.W.C.A. poster for the United War Work Campaign showing a young woman seated at a switchboard with soldiers in the background.","Poster shows a hand strangling a snake decorated with the German Iron Cross. Text: Attention! The German viper is taken. It is now necessary to pull out the poisonous teeth!","Poster shows a sign, with a song bird perched on it, in a bed of poppies and sunflowers. Text on sign encourages the planting of sunflowers and poppies to produce oil. Seeds and instructions provided by the War Committee for Oils and Fats.","Poster showing a man relaxing in a lounge chair, with newspaper open to the sports pages, and gazing into the smoke from his pipe, where he visualizes himself in combat. The man in combat gazes into smoke from a bomb, and visualizes a hockey game. Below are small scenes of recreation and entertainment, including dining, dancing, theater, ice skating, hockey, and baseball.","Poster shows two \"men\" walking. The bodies are fruit pits dripping oil. Text encourages people to collect fruit pits to extract oil. Locations of the collection places is pasted at bottom of poster. Poster issued by the Munich office of the War Commission for Oils and Fats (Kriegsausschuss fu\u0308r O\u0308el und Fette).","Poster shows a woman and child and an elderly man placing coins in a large bag surrounded by oak leaves. In the background a soldier and another woman with her child. Text encourages people to subscribe for the 7th War Loan.","Poster shows a man, surrounded by flames, straddling a rock and pointing a bow and arrow into the distance. Text encourages people to subscribe to the ninth war loan.","Poster shows a African soldier seated on the one French side of  the Rhine River; on the opposite side is a castle on a cliff. Text: German women protest the colored occupation of the Rhine.","Poster showing a soldier standing defiant as a woman and child flee a burning village.","World War I recruiting poster showing a row of smiling British soldiers.","Poster shows a gigantic Russian man standing on the burning ruins of a city. Text: Germany's ideal future under the leadership of the Bolsheviks. Poster issued by the Association to Combat Bolshevism.","Poster shows an armor breast plate and helmet; in background a display of flags marked RF (Re\u0301publque Franc\u0326ais). Text announces an exhibit of Bavarian war spoils to benefit the Red Cross.","Poster showing a truck fitted out as a YMCA canteen, serving soldiers, with smoke rising from battlefields in the distance.","A man (Raemaekers, 1869-1956) pointing an artist's double-ended pen at a surrendering caricature personification of Germania. This performance was to benefit the Franco-Holland war fund.","Poster shows a large angel holding an olive branch and a scroll with the words \"National ...amlung\" standing in front of a mass of German soldiers and civilians. In front of the angel is an anarchist holding a knife and preparing to throw a bomb. Text: Anarchy is the helper of reaction and famine.","Poster shows a disabled veteran with a prosthetic arm using a scythe to harvest wheat. Text announces the National War Relief Exhibition in Pozsony.","Translation of title: Policemen, soldiers, and civilians standing outside the Ancien Se\u0301minaire St. Sulpice which houses Le Secours de Guerre (the relief agency for war victims).","Poster showing two cherubs decorating a German helmet with garlands of flowers. Text: Altona's War Relief Flower Day. Poster also announces opening of the Flower Exhibit at the Kaiserhof.","Poster shows swarms of British planes bombing a factory. Text: What England wants! Additional text is a quote from British Labour party leader Johnson-Hicks which appeared in the Daily Telegraph, Jan. 3, 1918: \"One must bomb the Rhine industrial area day by day with hundreds of airplanes, until the cure [destruction of German industrial production] has occurred.\"","A little girl wearing a torn dress with red, blue, and white stripes, the colors of France, and a Phrygian cap, a symbol of the French Revolution.","Poster shows an Italian soldier holding his bayoneted rifle in one hand and pointing with the other. Behind him, a conflagration. Text advertises the latest subscription for war bonds.","Poster shows two Austrian soldiers pushing open a large, heavy, door to sunshine and the word \"Friede\" (Peace). Text: 8th War Loan.","Poster shows four starving children at the feet of a large, monstrous looking soldier. Text: To feed one occupying soldier well, four German children must go hungry.","Poster showing a soldier and a sailor shaking hands, as a woman looks on.","Poster showing Uncle Sam shaking hands with a woman holding a hoe.","Poster showing an old veteran, wearing his decorations, shaking hands with a young soldier.","Poster shows a soldier with a wooden leg and one hand on a plow. A woman behind him holds his crutch. Text: Ludendorff Fund for the War Disabled.","Poster showing a hand holding a war bond with the silhouette of the Capitol in the background.","Poster showing soldiers shaking hands, as one points to the motto, \"Small nations must be free.\" Background features maple leaf and shamrocks.","Poster shows a female figure representing Germany(?), with one hand on a man's shoulder, and the other gesturing toward a seaside resort. Text is solicitation for the Fatherland Fund to build recreation homes where disabled war veterans can recover.","Poster shows a wounded German soldier holding tools in one hand and a crutch in the other. Text: Ludendorff Fund for War Disabled.","Soldier shaking hands with worker holding sledgehammer.","Poster showing a soldier shaking his fist at a zeppelin following bombing.","Poster showing a man \"Agitator\" shaking hands with and receiving an Iron Cross from the Kaiser in \"Plot Alley.\" A tiny bird comments, \"He'll get the double cross from him later.\"","Poster shows a bowl of fruit. Text instructs people to save fruit pits and either send them to school with their children or bring ","Poster showing a sailor in 19th century uniform, with modern battleships at sea and a distant shore in flames.","Poster shows a cocky Uncle Sam, wearing soldier's boots and smoking a cigarette, facing a  German butcher wearing a blood-soaked apron and a soldier's helmet. Poster announces an exhibition of Raemaekers' work.","Poster encouraging contributions to the Ludendorff Fund for War Disabled.","Poster showing Allied soldiers, left, and German soldiers, each group struggling to push a huge red ball \"Victory\" over a peak.","Poster showing battleships at sea.","Poster shows a blacksmith(?) holding a raised hammer, about to strike a snake with flames erupting from its mouth; in background smokestacks. Text: Work, the protection against anarchy.","Poster encouraging donations to the Ludendorff Fund for the War Disabled.","Poster showing soldiers, both injured and those helping them, arriving on a shore.","Personification of Germany standing on top of ledge over crouched people. Two vultures are at the bottom.","A woman sitting behind a French flag on a boat as she looks out at the battleships in the harbor.","Large sword cutting sugar cone in two.","Poster shows a soldier holding a sword and sheild with the letter R on it, facing flames. Text: Volunteers with all weapons will secure Berlin. Enlist in the Reinhard Brigade.","Poster encouraging contributions to the Ludendorff Fund for War Disabled.","Poster showing a mule \"American industry\" braying, having just kicked \"Kaiserism,\" \"Pacifist,\" and \"Hard times.\"","A soldier sitting on top of a hill, overlooking a valley and a bridge. The Germans had held St. Mihiel and surrounding areas since the first battle at the Marne in 1914.  At last, in 1918, under the command of General Ferdinand Foche (1851-1929), the allied forces broke through the German hold on St. Mihiel and it was safely under France's control once again.","Print shows Columbia holding a flag and a sword while standing on North America on top izens offering money on the left, and military personnel on the right.","Poster showing an image of a mother and child with the American flag, floating above a mass of soldiers with bayonets.","Poster showing a sun-face peeking over the horizon.","Poster showing a squirrel placing a nut in a hollow tree.","Poster showing a flag of four blue vertical bars on a white field with a wide red border, and numbered spaces for listing bond purchasers.","Poster showing a soldier with a flag and a sailor with a sign, \"We depend on you.\"","Poster showing Uncle Sam at a cash register.","Poster showing a large button, \"V--Liberty loan.\"","Poster showing head-and-shoulders portrait of Woodrow Wilson and a quote from him.","Poster showing a skyline in twilight.","Poster showing a map, \"The garden spot, Lancaster County, 100% American,\" with fall harvests, bags of money, and dates 1729 and 1918.","Poster showing a woman attaching a triangle to complete a five-pointed star \"Victory.\"","Poster showing Uncle Sam about to write on a blackboard with chalk.","Poster showing the flag of three vertical blue stripes on a white ground with a wide red border.","Poster showing a soldier throwing a grenade, a bugler, and soldiers singing around a piano.","Poster features text only.","Poster showing a pair of staring eyes on a black background.","Poster showing large red cross.","Poster showing Kaiser Wilhelm attempting to walk across a sea of soldiers with bayonets aloft.","Poster showing a soldier with his mother.","Poster showing soldiers climbing out of a trench as shells burst over head.","Poster showing a Red Cross nurse offering a wounded soldier a drink from a canteen.","Movie poster showing four soldiers, one from each allied country.","Poster showing a soldier and a sailor with the American flag, holding a sign, \"We depend on you.\"","Poster showing soldiers marching.","Poster showing a bloodied fist holding a knife rising from the sea, in the background is an American ship.","
